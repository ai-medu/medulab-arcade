<style>
.dsc-wrap { display:flex; flex-direction:column; gap:10px; margin:6px 0 14px; }
.dsc-group { padding:10px 12px; border-radius:12px; border:1px dashed var(--border); }
.dsc-base { border-color: rgba(236,72,153,0.5); background: rgba(236,72,153,0.05); }
.dsc-extra { border-color: rgba(245,158,11,0.55); background: rgba(245,158,11,0.06); }
.dsc-title { font-size:12.5px; font-weight:800; margin-bottom:8px; }
.dsc-title small { font-weight:500; font-size:11.5px; color: var(--text-muted); }
.dsc-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.dsc-row > * { flex:1 1 140px; min-width:0; }
.dsc-sess { display:flex; align-items:center; gap:6px; flex:0 0 96px; font-size:13px; font-weight:700; }
.dsc-sess input { flex:1; min-width:0; }
.dsc-in { height:38px; box-sizing:border-box; padding:0 11px; border-radius:9px; border:1px solid var(--border); background:rgba(255,255,255,0.06); color:var(--text-primary, #fff); font-size:13px; font-family:inherit; width:100%; }
.dsc-in[readonly] { opacity:.75; }
.dsc-hint { font-size:12px; margin-top:6px; color: var(--text-muted); min-height:0; }
.dsc-hint:empty { display:none; }
</style>
<script>
/* 청구서 할인 입력기: 기본할인(매달) + 추가할인(이번 달만, '결석차감'은 결석 횟수 × 1회 수업비) */
if (!window.DiscEditor) {
window.DiscEditor = function (p, getTypes, onChange) {
    var ctx = { fee: 0, abs: 0 };
    function el(id) { return document.getElementById(p + id); }
    function esc(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function won(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
    function types() { return getTypes() || []; }
    function typeOf(name) { return types().filter(function (t) { return t.name === name; })[0]; }
    function options(selKey, withAbsence) {
        return '<option value="">할인 없음</option>' + types().filter(function (t) { return withAbsence || !t.is_absence; }).map(function (t) {
            var label = t.is_absence ? t.name + ' (결석 횟수 × 1회 수업비)' : t.name + (t.amount ? ' (' + won(t.amount) + ')' : '');
            return '<option value="' + esc(t.name) + '"' + (t.name === selKey ? ' selected' : '') + '>' + esc(label) + '</option>';
        }).join('') + '<option value="__custom"' + (selKey === '__custom' ? ' selected' : '') + '>직접입력</option>';
    }
    function keyOf(reason, withAbsence) {
        if (!reason) return '';
        var t = typeOf(reason);
        return (t && (withAbsence || !t.is_absence)) ? reason : '__custom';
    }
    function room() { return Math.max(ctx.fee - ctx.abs, 0); }
    function baseValue() { return Math.max(0, Math.min(parseInt(el('BaseAmt').value, 10) || 0, room())); }
    function perSession() { return Math.floor(Math.max(ctx.fee - baseValue(), 0) / 4); }
    function extraIsAbsence() { var t = typeOf(el('ExtraSel').value); return !!(t && t.is_absence); }
    function extraSessions() { return Math.max(1, Math.min(parseInt(el('ExtraSessions').value, 10) || 1, 31)); }
    function extraValue() {
        var v = extraIsAbsence() ? extraSessions() * perSession() : (parseInt(el('ExtraAmt').value, 10) || 0);
        return Math.max(0, Math.min(v, Math.max(room() - baseValue(), 0)));
    }
    function refresh(silent) {
        var abs = extraIsAbsence();
        el('ExtraSessWrap').style.display = abs ? '' : 'none';
        el('ExtraAmt').readOnly = abs;
        if (abs) { el('ExtraAmt').value = extraSessions() * perSession(); }
        el('ExtraCustom').style.display = el('ExtraSel').value === '__custom' ? '' : 'none';
        el('BaseCustom').style.display = el('BaseSel').value === '__custom' ? '' : 'none';
        el('ExtraHint').textContent = abs ? '1회 수업비 ' + won(perSession()) + ' (할인된 수업비 ' + won(Math.max(ctx.fee - baseValue(), 0)) + ' ÷ 4) × ' + extraSessions() + '회 = ' + won(extraValue()) : '';
        var res = { base: baseValue(), extra: extraValue(), total: ctx.fee - ctx.abs - baseValue() - extraValue() };
        if (!silent && onChange) onChange(res);
        return res;
    }
    function bind() {
        el('BaseSel').addEventListener('change', function () {
            var t = typeOf(this.value);
            if (this.value === '') el('BaseAmt').value = '';
            else if (t && t.amount) el('BaseAmt').value = t.amount;
            else if (this.value !== '__custom') el('BaseAmt').value = '';
            refresh();
        });
        el('BaseAmt').addEventListener('input', function () { refresh(); });
        el('BaseCustom').addEventListener('input', function () { /* 사유만 바뀜 */ });
        el('ExtraSel').addEventListener('change', function () {
            var t = typeOf(this.value);
            if (this.value === '') { el('ExtraAmt').value = ''; }
            else if (t && t.is_absence) { el('ExtraSessions').value = el('ExtraSessions').value || 1; }
            else if (t && t.amount) { el('ExtraAmt').value = t.amount; }
            else { el('ExtraAmt').value = ''; }
            refresh();
        });
        el('ExtraSessions').addEventListener('input', function () { refresh(); });
        el('ExtraAmt').addEventListener('input', function () { refresh(); });
    }
    bind();
    return {
        setCtx: function (fee, abs) { ctx.fee = Number(fee) || 0; ctx.abs = Number(abs) || 0; },
        // 값 채우기. silent=true 면 금액 재계산 알림(onChange)을 보내지 않는다 (저장된 금액을 그대로 보여 줄 때)
        fill: function (baseReason, baseAmount, extraReason, extraAmount, extraSessions, silent) {
            var bk = keyOf(baseReason, false), ek = keyOf(extraReason, true);
            el('BaseSel').innerHTML = options(bk, false);
            el('ExtraSel').innerHTML = options(ek, true);
            el('BaseCustom').value = bk === '__custom' ? baseReason : '';
            el('ExtraCustom').value = ek === '__custom' ? extraReason : '';
            el('BaseAmt').value = baseAmount || '';
            el('ExtraAmt').value = extraAmount || '';
            el('ExtraSessions').value = extraSessions || 1;
            return refresh(silent);
        },
        refresh: refresh,
        values: function () {
            var bKey = el('BaseSel').value, eKey = el('ExtraSel').value;
            var abs = extraIsAbsence();
            return {
                discount_reason: bKey === '__custom' ? ((el('BaseCustom').value || '').trim() || '직접입력') : bKey,
                discount_amount: el('BaseAmt').value || '0',
                extra_reason: eKey === '__custom' ? ((el('ExtraCustom').value || '').trim() || '직접입력') : eKey,
                extra_amount: abs ? '0' : (el('ExtraAmt').value || '0'),
                extra_sessions: abs ? String(extraSessions()) : '1'
            };
        },
        summary: function () { var r = refresh(true); return r; }
    };
};
}
</script>
