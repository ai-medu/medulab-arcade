<script>
/* 밝은 테마 시안: ?theme=light 로 켜고 ?theme=dark 로 끈다 (브라우저에 기억) */
(function () {
    try {
        var q = new URLSearchParams(location.search).get('theme');
        if (q === 'light') localStorage.setItem('medulab_theme', 'light');
        else if (q === 'dark') localStorage.removeItem('medulab_theme');
        if (localStorage.getItem('medulab_theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    } catch (e) {}
})();
</script>
