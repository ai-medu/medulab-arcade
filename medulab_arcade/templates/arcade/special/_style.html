<style>
.sp-wrap { max-width: 880px; margin: 40px auto; padding: 0 20px; }
.sp-title { font: 900 26px 'Orbitron', sans-serif; background: linear-gradient(90deg, var(--accent-green), var(--accent-blue)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
.sp-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 26px; line-height: 1.6; }
.sp-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; padding: 24px; margin-bottom: 18px; }
.sp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.sp-wrap.wide { max-width: 1100px; }
.sp-admin-row { display: flex; gap: 8px; margin-top: 8px; }
.sp-lecture-wrap { min-width: 0; }
@media (max-width: 900px) { .sp-grid { grid-template-columns: repeat(2, 1fr); } }
.sp-lecture { display: block; text-decoration: none; color: inherit; background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; transition: transform .15s, border-color .15s; }
.sp-lecture:hover { transform: translateY(-3px); border-color: var(--accent-green); }
.sp-lecture img { width: 100%; max-height: 200px; object-fit: cover; display: block; }
.sp-lecture-body { padding: 20px; }
.sp-lecture h3 { margin: 0 0 6px; font-size: 18px; }
.sp-meta { font-size: 13px; color: var(--text-muted); line-height: 1.8; }
.sp-facts { margin-top: 10px; display: grid; gap: 4px; line-height: 1.6; }
.sp-facts-sub { color: #00a37a; font-weight: 700; font-size: 12.5px; }
.sp-example-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.sp-example-gallery a { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.sp-example-gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; transition: transform .2s; }
.sp-example-gallery a:hover img { transform: scale(1.04); }
.sp-badge { display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800; margin-right: 6px; }
.sp-badge.open { background: rgba(0,200,150,.15); color: #00a37a; }
.sp-badge.closed { background: rgba(120,120,140,.18); color: var(--text-muted); }
.sp-badge.hot { background: rgba(245,158,11,.18); color: #d97706; }
.sp-price-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.sp-price-item { text-align: center; padding: 14px 8px; border-radius: 14px; background: rgba(120,120,140,.08); border: 1px solid var(--border); }
.sp-price-item b { display: block; font-size: 19px; margin-top: 4px; }
.sp-price-item small { font-size: 12px; color: var(--text-muted); font-weight: 700; }
.sp-price-item em { display: block; margin-top: 4px; font-style: normal; font-size: 11.5px; color: var(--text-muted); }
.sp-label { display: block; font-size: 13px; font-weight: 800; margin: 16px 0 6px; color: var(--text-secondary); }
.sp-input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #c7cbe0; background: #fff; color: #1f2937; font-size: 14px; box-sizing: border-box; }
.sp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sp-row4 { display: grid; grid-template-columns: 1.1fr 1.3fr .8fr 1.2fr; gap: 8px; margin-bottom: 8px; align-items: center; }
.sp-row4 .sp-input { min-width: 0; }
.sp-row4-head { display: grid; grid-template-columns: 1.1fr 1.3fr .8fr 1.2fr; gap: 8px; font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; }
.sp-friend-row { position: relative; padding: 10px 36px 2px 10px; border: 1px dashed var(--border); border-radius: 12px; margin-bottom: 8px; }
.sp-friend-row .sp-row4 { margin-bottom: 8px; }
.sp-friend-del { position: absolute; top: 6px; right: 8px; border: none; background: none; color: #dc2626; font-size: 18px; cursor: pointer; }
.sp-btn { display: inline-block; padding: 14px 22px; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--accent-green), var(--accent-blue)); color: #03140e; font-weight: 900; font-size: 15px; cursor: pointer; text-decoration: none; }
.sp-btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); font-weight: 700; }
.sp-notice { padding: 14px 16px; border-radius: 12px; margin-bottom: 16px; font-size: 13.5px; line-height: 1.6; }
.sp-notice.good { background: rgba(0,200,150,.1); border: 1px solid rgba(0,200,150,.3); color: #047857; }
.sp-notice.info { background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.3); color: #1d4ed8; }
.sp-notice.warn { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); color: #b45309; }
.sp-notice.err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #b91c1c; }
.sp-check { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
.sp-check input { width: 18px; height: 18px; }
.sp-total { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 0; margin-top: 18px; border-top: 1px dashed var(--border); font-size: 18px; font-weight: 900; }
.sp-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.sp-table th, .sp-table td { padding: 10px 12px; border-top: 1px solid var(--border); text-align: left; vertical-align: top; }
.sp-table th { color: var(--text-muted); font-size: 12px; border-top: none; }
.sp-thumb { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.sp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sp-thumb .sp-emoji { font-size: 64px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.25)); }
.sp-thumb.t0 { background: linear-gradient(135deg, #34d399, #3b82f6); }
.sp-thumb.t1 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.sp-thumb.t2 { background: linear-gradient(135deg, #a78bfa, #ec4899); }
.sp-thumb.t3 { background: linear-gradient(135deg, #22d3ee, #6366f1); }
.sp-thumb .sp-thumb-badge { position: absolute; top: 12px; left: 12px; }
.sp-poster { display: block; background: rgba(120,120,140,.08); line-height: 0; }
.sp-poster img { width: 100%; height: auto; max-height: 640px; object-fit: contain; display: block; margin: 0 auto; }
.sp-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 4px 0 8px; }
.sp-info-item { padding: 14px 16px; border-radius: 14px; background: rgba(120,120,140,.08); border: 1px solid var(--border); }
.sp-info-item.wide { grid-column: 1 / -1; }
.sp-info-label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px; }
.sp-info-value { font-size: 16px; font-weight: 800; line-height: 1.5; }
.sp-info-value small { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); }
@media (max-width: 640px) { .sp-row4, .sp-row4-head { grid-template-columns: 1fr 1fr; } .sp-row4-head { display: none; } }
@media (max-width: 480px) { .sp-grid { grid-template-columns: 1fr; } .sp-row { grid-template-columns: 1fr; } .sp-price-box { grid-template-columns: 1fr; } .sp-info { grid-template-columns: 1fr; } }
.sp-lecture.sp-past { opacity:.55; filter:grayscale(1); cursor:not-allowed; pointer-events:none; }
.sp-lecture.sp-past:hover { transform:none; box-shadow:none; }
</style>
