{% extends "arcade/base.html" %}

{% block title %}타자게임 - 플레이{% endblock %}

{% block extra_css %}
<style>
.tg-wrap { max-width: 900px; margin: 30px auto; padding: 0 20px; text-align: center; }
.tg-wrap h1 { font-size: 26px; font-weight: 900; margin: 0 0 6px; }
.tg-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 14px; }
.tg-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.tg-tab { padding: 8px 18px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-weight: 700; cursor: pointer; }
.tg-tab.active { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.5); color: #3b82f6; }

/* 게임 선택 (4열 x 4줄) */
.tg-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tg-card { border: 1px solid var(--border); border-radius: 16px; padding: 16px 6px 12px; background: var(--bg-card, rgba(255,255,255,.04)); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; color: inherit; font: inherit; transition: transform .12s, border-color .12s, box-shadow .12s; }
.tg-card:hover { transform: translateY(-3px); border-color: rgba(59,130,246,.6); box-shadow: 0 6px 18px rgba(59,130,246,.18); }
.tg-card .ic { font-size: 40px; line-height: 1; }
.tg-card .nm { font-weight: 800; font-size: 15px; }
.tg-card .st { font-size: 11px; color: #f59e0b; letter-spacing: 1px; }
.tg-card .bs { font-size: 11px; color: var(--text-muted); min-height: 14px; }
@media (max-width: 560px) {
    .tg-wrap { padding: 0 10px; }
    .tg-menu { gap: 6px; }
    .tg-card { padding: 10px 2px 8px; border-radius: 12px; }
    .tg-card .ic { font-size: 28px; }
    .tg-card .nm { font-size: 11px; word-break: keep-all; }
    .tg-card .st { font-size: 9px; }
    .tg-card .bs { font-size: 9px; }
}

/* 게임 화면 */
.tg-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.tg-back { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-weight: 700; cursor: pointer; }
.tg-gtitle { font-weight: 900; font-size: 18px; }
.tg-info { display: flex; justify-content: center; gap: 24px; margin-bottom: 10px; font-weight: 700; flex-wrap: wrap; }
.tg-info b { color: #3b82f6; }
.tg-board { position: relative; height: 440px; border-radius: 18px; overflow: hidden; border: 2px solid var(--border); background: linear-gradient(#dbeafe, #eff6ff); color: #1e293b; }
@media (max-width: 560px) { .tg-board { height: 400px; } }
.tg-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #22c55e; }
.tg-base { position: absolute; z-index: 1; font-size: 44px; line-height: 1; }
.tg-item { position: absolute; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.tg-item .em { font-size: 34px; line-height: 1; }
.tg-chip { padding: 5px 12px; border-radius: 999px; background: #fff; color: #1e293b; font-weight: 800; font-size: 17px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.tg-item.bomb .tg-chip { background: #fecaca; }
.tg-item.hit .tg-chip { background: #fde68a; }
.tg-zone { position: absolute; top: 8px; bottom: 8px; width: 70px; border-radius: 16px; border: 3px dashed #f59e0b; background: rgba(245,158,11,.15); animation: tg-beat 1s infinite; }
@keyframes tg-beat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.tg-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(15,23,42,.62); color: #fff; z-index: 9; padding: 20px; text-align: center; }
.tg-msg .big { font-size: 24px; font-weight: 900; }
.tg-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.tg-btn { padding: 12px 24px; border-radius: 14px; border: none; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
.tg-btn.sub { background: rgba(255,255,255,.2); }
.tg-input { width: 100%; max-width: 420px; margin-top: 14px; padding: 14px 18px; border-radius: 14px; border: 2px solid var(--border); font-size: 18px; text-align: center; background: var(--bg-card); color: var(--text-primary, inherit); outline: none; }
.tg-input:focus { border-color: #3b82f6; }
.tg-flash { animation: tg-flash .3s; }
@keyframes tg-flash { 0%,100% { box-shadow: none; } 50% { box-shadow: inset 0 0 0 6px rgba(239,68,68,.7); } }
.tg-shake { animation: tg-shake .3s; }
@keyframes tg-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.tg-float { position: absolute; font-weight: 900; font-size: 22px; pointer-events: none; z-index: 8; animation: tg-float .8s ease-out forwards; white-space: nowrap; }
@keyframes tg-float { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }

/* 레이스 */
.tg-lane { position: absolute; left: 0; right: 0; height: 64px; background: rgba(255,255,255,.55); border-top: 3px dashed #94a3b8; border-bottom: 3px dashed #94a3b8; }
.tg-runner { position: absolute; top: 6px; font-size: 44px; line-height: 1; }
.tg-flag { position: absolute; right: 8px; top: 8px; font-size: 40px; line-height: 1; }

/* 퀴즈형 */
.tg-vis { position: absolute; left: 0; right: 0; top: 0; bottom: 130px; display: flex; align-items: center; justify-content: center; font-size: 96px; }
.tg-prompt { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; }
.tg-prompt .w { font-size: 34px; font-weight: 900; }
.tg-prompt .s { font-size: 14px; color: #475569; font-weight: 700; }
.tg-tile { display: inline-block; min-width: 42px; padding: 8px 6px; margin: 3px; border-radius: 10px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); font-size: 28px; font-weight: 900; }
.tg-brick { position: absolute; width: 60px; height: 24px; border-radius: 4px; border: 2px solid rgba(0,0,0,.25); }
.tg-eaten { position: absolute; left: 0; right: 0; bottom: 6px; font-size: 22px; line-height: 1.2; padding: 0 8px; }
.tg-locks { display: flex; gap: 12px; font-size: 56px; }
.tg-chat { position: absolute; left: 0; right: 0; top: 0; bottom: 14px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.tg-bubble { max-width: 70%; padding: 8px 14px; border-radius: 16px; font-weight: 800; font-size: 20px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.tg-bubble.cpu { align-self: flex-start; background: #fff; }
.tg-bubble.me { align-self: flex-end; background: #bfdbfe; }
.tg-bubble.sys { align-self: center; background: #fef9c3; font-size: 15px; }
.tg-timebar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: rgba(0,0,0,.1); }
.tg-timebar i { display: block; height: 100%; width: 100%; background: #22c55e; transition: width .2s linear; }
</style>
{% endblock %}

{% block content %}
<main class="tg-wrap">
    <h1>🎮 타자게임</h1>
    <p class="tg-sub" id="tgSub">하고 싶은 게임을 눌러 보세요!</p>
    <div class="tg-tabs">
        <button class="tg-tab active" data-lang="ko">한글</button>
        <button class="tg-tab" data-lang="en">영어</button>
    </div>

    <section id="tgMenu" class="tg-menu"></section>

    <section id="tgGame" style="display:none">
        <div class="tg-top">
            <button class="tg-back" id="tgBack">← 게임 목록</button>
            <div class="tg-gtitle" id="tgTitle"></div>
            <span style="width:90px"></span>
        </div>
        <div class="tg-info"><span><span id="tgLA">점수</span> <b id="tgA">0</b></span><span><span id="tgLB">목숨</span> <b id="tgB"></b></span><span>최고 <b id="tgBest">0</b></span></div>
        <div class="tg-board" id="tgBoard"></div>
        <input type="text" id="tgInput" class="tg-input" placeholder="여기에 입력하고 Enter" autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
    </section>
</main>

            return { vis: b[2], answers: [b[1]], hint: hintOf(b[1]), prompt: '<div class="w" style="font-size:26px">' + b[0] + '</div><div class="s">빈칸에 들어갈 낱말을 쓰세요</div>' };
        });
        countGame({ items: items, unitLabel: '남은 문제', doneText: '빈칸을 모두 채웠어요' });
    } };
    GAMES.vault = { name: '금고 풀기', icon: '🔐', stars: 2, unit: '초', lower: true, run: function () {
        var words = shuffle(pool(MID)).slice(0, 5);
        var items = words.map(function (w) { return { vis: '', answers: [w], hint: hintOf(w), prompt: '<div class="s">자물쇠를 열어요! 낱말을 쓰세요</div><div class="w">' + w + '</div>' }; });
        function locks(open) { return '<div class="tg-locks">' + words.map(function (_, i) { return '<span>' + (i < open ? '🔓' : '🔒') + '</span>'; }).join('') + '</div>'; }
        items.forEach(function (q, i) { q.vis = locks(i); });
        countGame({ items: items, unitLabel: '남은 자물쇠', doneText: '금고를 활짝 열었어요 💰', onCorrect: function (i, vis) { vis.innerHTML = locks(i + 1); } });
    } };
    GAMES.bomb = { name: '폭탄 해체', icon: '💣', stars: 3, unit: '개', run: function () {
        var life = 3, defused = 0, goal = 10, els = quizBoard(), vis = els[0], prm = els[1], word, deadline = 0, limit = 0, exploding = false;
        board.style.background = 'linear-gradient(#fee2e2,#fef2f2)';
        setInfo('해체한 폭탄', 0, '목숨', hearts(life));
        vis.style.flexDirection = 'column';
        function next() {
            exploding = false; word = mkWord(pool(LONG)); limit = Math.max(9, 16 - defused * 0.7);
            deadline = Date.now() + limit * 1000;
            vis.innerHTML = '<div id="tgBomb">💣</div><div style="width:240px;height:14px;border-radius:8px;background:rgba(0,0,0,.12);overflow:hidden"><i id="tgFuse" style="display:block;height:100%;width:100%;background:#ef4444"></i></div>';
            prm.innerHTML = '<div class="s">폭탄이 터지기 전에 쓰세요!</div><div class="w">' + word + '</div>';
        }
        next();
        frames(function () {
            if (exploding) return;
            var left = deadline - Date.now(), f = document.getElementById('tgFuse');
            if (f) f.style.width = Math.max(0, left / (limit * 1000) * 100) + '%';
            if (left <= 0) {
                exploding = true; life--; setB(hearts(life)); flash(); document.getElementById('tgBomb').textContent = '💥';
                if (life <= 0) { after(function () { endGame({ title: '💥 펑! 게임 끝 (' + defused + '개 해체)', sub: cheer(defused, 8, 4), val: defused }); }, 600); return; }
                after(next, 900);
            }
        });
        onSubmit = function (v) {
            if (exploding || !v) return;
            if (eq(word, v)) {
                defused++; setA(defused); exploding = true; document.getElementById('tgBomb').textContent = '✅';
                if (defused >= goal) { after(function () { endGame({ title: '🏆 폭탄을 모두 해체했어요!', sub: '폭탄 ' + goal + '개 해체 성공', val: defused }); }, 500); return; }
                after(next, 450);
            } else shake(prm);
        };
    } };
    GAMES.chain = { name: '끝말잇기', icon: '🔗', stars: 2, unit: '번', run: function () {
        var used = {}, turns = 0, life = 3, need = [], deadline = 0, LIMIT = 25, goal = 10, over = false;
        var list = lang === 'ko' ? KO_CHAIN : uniq(EN_CHAIN.filter(function (w) { return /^[a-z]{2,}$/.test(w); }));
        board.style.background = 'linear-gradient(#f0f9ff,#e0f2fe)';
        board.innerHTML = '<div class="tg-chat" id="tgChat"></div><div class="tg-timebar"><i id="tgTimeI"></i></div>';
        var chat = document.getElementById('tgChat'), bar = document.getElementById('tgTimeI');
        setInfo('이은 횟수', 0, '목숨', hearts(life));
        function bubble(cls, text) { var b = mk('div', 'tg-bubble ' + cls, text); chat.appendChild(b); chat.scrollTop = chat.scrollHeight; }
        function lastCh(w) { return w.charAt(w.length - 1).toLowerCase(); }
        function starts(ch) { var a = [ch]; if (lang === 'ko' && DUEUM[ch]) a.push(DUEUM[ch]); return a; }
        function candidates(ch) { return list.filter(function (w) { return !used[w] && starts(ch).indexOf(w.charAt(0)) >= 0; }); }
        function cpuTurn(ch) {
            var c = candidates(ch);
            if (!c.length) { over = true; endGame({ title: '🎉 컴퓨터가 졌어요!', sub: '컴퓨터가 더 이상 말을 못 이었어요. 내가 이겼어요! (' + turns + '번 이었어요)', val: goal }); return; }
            var safe = c.filter(function (w) { return candidates(lastCh(w)).length > 0; }), pickFrom = safe.length ? safe : c;
            var w = pickFrom[rnd(0, pickFrom.length)]; used[w] = 1;
            after(function () { bubble('cpu', '🤖 ' + w); need = starts(lastCh(w)); deadline = Date.now() + LIMIT * 1000; input.disabled = false; input.focus(); }, 700);
        }
        var first = list[rnd(0, list.length)]; used[first] = 1; bubble('sys', '컴퓨터가 먼저 시작해요!'); bubble('cpu', '🤖 ' + first);
        need = starts(lastCh(first)); deadline = Date.now() + LIMIT * 1000;
        frames(function () {
            if (over) return;
            var left = deadline - Date.now(); bar.style.width = Math.max(0, left / (LIMIT * 1000) * 100) + '%';
            if (left <= 0) {
                life--; setB(hearts(life)); flash(); deadline = Date.now() + LIMIT * 1000;
                if (life <= 0) { over = true; endGame({ title: '게임 끝! ' + turns + '번 이었어요', sub: cheer(turns, 8, 4), val: turns }); return; }
                bubble('sys', '⏰ 시간이 다 됐어요! 다시 해 봐요');
            }
        });
        onSubmit = function (v) {
            if (over || !v || input.disabled) return;
            var w = lang === 'en' ? v.toLowerCase() : v;
            var okFmt = lang === 'ko' ? /^[가-힣]{2,}$/.test(w) : /^[a-z]{2,}$/.test(w);
            if (!okFmt) { bubble('sys', lang === 'ko' ? '두 글자 이상 한글 낱말을 써요' : 'Write a word with 2+ letters'); return; }
            if (need.indexOf(w.charAt(0)) < 0) { bubble('sys', '\'' + need.join('\' 또는 \'') + '\'(으)로 시작하는 말을 써요'); shake(chat); return; }
            if (used[w]) { bubble('sys', '이미 나온 말이에요! 다른 말을 써요'); return; }
            used[w] = 1; turns++; setA(turns); bubble('me', w + ' 🙂');
            if (turns >= goal) { over = true; after(function () { endGame({ title: '🏆 대단해요! ' + goal + '번 이었어요', sub: '끝말잇기 성공!', val: turns }); }, 400); return; }
            input.disabled = true; cpuTurn(lastCh(w));
        };
    } };

    var ORDER = ['rain', 'meteor', 'balloon', 'zombie', 'ninja', 'car', 'rabbit', 'brick', 'hamster', 'rhythm', 'scramble', 'pic', 'blank', 'vault', 'bomb', 'chain'];

    /* =============== 화면 전환 =============== */
    function buildMenu() {
        menu.innerHTML = '';
        ORDER.forEach(function (id) {
            var g = GAMES[id], b = readBest(id);
            var card = mk('button', 'tg-card', '<span class="ic">' + g.icon + '</span><span class="nm">' + g.name + '</span><span class="st">' + new Array(g.stars + 1).join('★') + new Array(4 - g.stars).join('☆') + '</span><span class="bs">' + (b !== null ? '🏅 ' + b + g.unit : '') + '</span>');
            card.onclick = function () { startGame(id); };
            menu.appendChild(card);
        });
    }
    function startGame(id) {
        stopAll(); cur = id; var g = GAMES[id];
        menu.style.display = 'none'; document.getElementById('tgSub').style.display = 'none'; gameEl.style.display = '';
        document.getElementById('tgTitle').textContent = g.icon + ' ' + g.name;
        var b = readBest(id); bestEl.textContent = b !== null ? b : 0;
        board.className = 'tg-board'; board.style.cssText = ''; board.innerHTML = '';
        input.value = ''; input.disabled = false; input.placeholder = lang === 'ko' ? '여기에 쓰고 Enter' : 'Type here and press Enter';
        g.run();
        if (!input.disabled) input.focus();
    }
    function toMenu() {
        stopAll(); cur = null; input.disabled = true; gameEl.style.display = 'none';
        document.getElementById('tgSub').style.display = ''; menu.style.display = ''; buildMenu();
    }
    document.getElementById('tgBack').onclick = toMenu;
    input.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' || !onSubmit) return;
        // 한글 조합 중에 눌러도 마지막 글자가 확정된 뒤 값을 읽는다
        setTimeout(function () { var v = input.value.replace(/\s+/g, ' ').trim(); input.value = ''; if (onSubmit && v) onSubmit(v); }, 0);
    });
    document.querySelectorAll('.tg-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.lang === lang);
        b.addEventListener('click', function () {
            document.querySelectorAll('.tg-tab').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active'); lang = b.dataset.lang;
            try { localStorage.setItem('tg2_lang', lang); } catch (e) {}
            if (cur) toMenu(); else buildMenu();
        });
    });
    buildMenu();
})();
</script>
{% endblock %}
