{% extends "arcade/base.html" %}

{% block title %}마우스연습 - 플레이{% endblock %}

{% block extra_css %}
<style>
.mp-wrap { max-width: 900px; margin: 30px auto; padding: 0 20px; text-align: center; }
.mp-wrap h1 { font-size: 26px; font-weight: 900; margin: 0 0 6px; }
.mp-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
.mp-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
.mp-tab { padding: 10px 18px; border-radius: 12px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-weight: 700; cursor: pointer; font-size: 14px; }
.mp-tab.active { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.5); color: #3b82f6; }
.mp-group { font-size: 12px; color: var(--text-muted); font-weight: 700; margin: 10px 0 6px; }
.mp-info { display: flex; justify-content: center; gap: 24px; margin: 12px 0; font-weight: 700; font-size: 15px; }
.mp-info b { color: #3b82f6; }
.mp-board { position: relative; height: 420px; border: 2px dashed var(--border); border-radius: 18px; overflow: hidden; user-select: none; -webkit-user-select: none; background: rgba(59,130,246,0.04); }
.mp-msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 5; }
.mp-msg .big { font-size: 22px; font-weight: 900; }
.mp-start { padding: 12px 28px; border-radius: 14px; border: none; background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; }
.mp-target { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444); border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer; }
.mp-target.dbl { background: radial-gradient(circle at 35% 35%, #fde68a, #f59e0b); }
.mp-drag { position: absolute; width: 60px; height: 60px; border-radius: 14px; background: radial-gradient(circle at 35% 35%, #86efac, #22c55e); border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: grab; touch-action: none; }
.mp-zone { position: absolute; width: 100px; height: 100px; border-radius: 18px; border: 3px dashed #3b82f6; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #3b82f6; font-size: 13px; }

/* 클릭 게임 공통 */
.mp-emoji { position: absolute; line-height: 1; cursor: pointer; text-align: center; touch-action: manipulation; }
.mp-float { position: absolute; font-weight: 900; font-size: 24px; pointer-events: none; z-index: 4; animation: mp-float .7s ease-out forwards; }
@keyframes mp-float { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
.mp-shake { animation: mp-shake .3s; }
@keyframes mp-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

/* 두더지 */
.mp-grid { display: grid; grid-template-columns: repeat(3, var(--hs)); gap: 14px; justify-content: center; align-content: center; height: 100%; --hs: min(110px, 24vw); }
.mp-hole { position: relative; width: var(--hs); height: var(--hs); border-radius: 50%; background: radial-gradient(circle at 50% 60%, #5b3a1e, #2d1b0b); overflow: hidden; cursor: pointer; }
.mp-mole { position: absolute; left: 0; right: 0; bottom: -100%; text-align: center; font-size: min(70px, 15vw); line-height: 1; transition: bottom .12s; }
.mp-mole.up { bottom: 8%; }

/* 과녁 */
.mp-bull { position: absolute; border-radius: 50%; cursor: crosshair; box-shadow: 0 4px 14px rgba(0,0,0,.3);
    background: radial-gradient(circle, #ef4444 0 20%, #fff 20% 40%, #3b82f6 40% 60%, #fff 60% 80%, #facc15 80% 100%); }

/* 숫자 */
.mp-num { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #93c5fd, #3b82f6); color: #fff; font-weight: 900; font-size: 28px; display: flex; align-items: center; justify-content: center; border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); cursor: pointer; }
.mp-num.ok { background: radial-gradient(circle at 35% 35%, #86efac, #22c55e); opacity: .35; cursor: default; }

/* 짝 맞추기 */
.mp-cards { display: grid; grid-template-columns: repeat(4, var(--cs)); gap: 12px; justify-content: center; align-content: center; height: 100%; --cs: min(100px, 19vw); }
.mp-card { width: var(--cs); height: calc(var(--cs) * 1.2); border-radius: 14px; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: min(48px, 10vw); cursor: pointer; border: 3px solid #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.mp-card.open { background: #fff; }
.mp-card.matched { background: #dcfce7; opacity: .55; cursor: default; }
</style>
{% endblock %}

{% block content %}
<main class="mp-wrap">
    <h1>🖱️ 마우스연습</h1>
    <p class="mp-sub">마우스와 친해지는 연습이에요. 연습 종류를 고르고 시작해 보세요!</p>
    <div class="mp-tabs">
        <button class="mp-tab active" data-mode="click">👆 클릭</button>
        <button class="mp-tab" data-mode="dbl">✌️ 더블클릭</button>
        <button class="mp-tab" data-mode="drag">✋ 드래그</button>
    </div>
    <div id="mpGames" style="display:none">
    <div class="mp-group">🎮 클릭 게임 (하고 싶은 게임을 골라 보세요)</div>
    <div class="mp-tabs">
        <button class="mp-tab" data-mode="mole">🔨 두더지 잡기</button>
        <button class="mp-tab" data-mode="balloon">🎈 풍선 터뜨리기</button>
        <button class="mp-tab" data-mode="fruit">🍎 과일 골라 누르기</button>
        <button class="mp-tab" data-mode="numbers">🔢 숫자 순서대로</button>
        <button class="mp-tab" data-mode="target">🎯 과녁 맞히기</button>
        <button class="mp-tab" data-mode="memory">🃏 짝 맞추기</button>
        <button class="mp-tab" data-mode="bug">🐛 벌레 잡기</button>
    </div>
    </div>
    <div id="mpGamesDbl" style="display:none">
    <div class="mp-group">🎮 더블클릭 게임 (하고 싶은 게임을 골라 보세요)</div>
    <div class="mp-tabs">
        <button class="mp-tab" data-mode="egg">🥚 알 깨기</button>
        <button class="mp-tab" data-mode="gift">🎁 선물 열기</button>
        <button class="mp-tab" data-mode="popcorn">🍿 팝콘 터뜨리기</button>
    </div>
    </div>
    <div id="mpGamesDrag" style="display:none">
    <div class="mp-group">🎮 드래그 게임 (하고 싶은 게임을 골라 보세요)</div>
    <div class="mp-tabs">
        <button class="mp-tab" data-mode="basket">🧺 과일 바구니</button>
        <button class="mp-tab" data-mode="sort">🎨 색깔 분류</button>
        <button class="mp-tab" data-mode="slots">🔢 숫자 칸 맞추기</button>
    </div>
    </div>
    <div class="mp-info"><span><span id="mpL1">남은 개수</span> <b id="mpLeft">10</b></span><span><span id="mpL2">시간</span> <b id="mpTime">0.0</b><span id="mpU2">초</span></span></div>
    <div class="mp-board" id="mpBoard"></div>
</main>
<script>
(function () {
    var TOTAL = 10, mode = 'click', left = TOTAL, t0 = 0, timer = null, running = false;
    var board = document.getElementById('mpBoard');
    var leftEl = document.getElementById('mpLeft'), timeEl = document.getElementById('mpTime');
    var l1El = document.getElementById('mpL1'), l2El = document.getElementById('mpL2'), u2El = document.getElementById('mpU2');
    var HELP = {
        click: '빨간 공을 클릭하세요', dbl: '노란 공을 빠르게 두 번 클릭하세요', drag: '초록 상자를 점선 칸으로 끌어다 놓으세요',
        mole: '구멍에서 나온 두더지를 눌러서 잡으세요! (30초)', balloon: '떠오르는 풍선을 눌러서 터뜨리세요! (30초)',
        fruit: '과일은 누르고, 폭탄 💣은 누르면 안 돼요! (30초)', numbers: '1부터 10까지 순서대로 눌러 보세요',
        target: '과녁의 한가운데를 눌러 보세요. 가운데일수록 점수가 높아요!', memory: '카드를 두 장씩 뒤집어서 같은 그림을 찾아보세요',
        bug: '기어다니는 벌레를 3번씩 눌러서 잡으세요',
        egg: '알을 빠르게 두 번 눌러서 깨 주세요! 병아리가 나와요 (30초)', gift: '선물 상자 8개를 두 번씩 눌러서 모두 열어 보세요',
        popcorn: '옥수수를 두 번 눌러서 팝콘으로 터뜨려요! (30초)',
        basket: '과일을 끌어서 바구니에 넣어 주세요', sort: '빨간 공은 빨간 칸에, 파란 공은 파란 칸에 끌어다 놓으세요',
        slots: '숫자를 끌어서 같은 숫자 칸에 맞춰 놓으세요'
    };
    var DEFAULT_LABELS = ['남은 개수', '시간', '초'];

    /* ---------- 공통 도우미 ---------- */
    var cleanups = [];
    function addC(fn) { cleanups.push(fn); }
    function stopAll() { cleanups.forEach(function (f) { try { f(); } catch (e) {} }); cleanups = []; }
    function after(fn, ms) { var id = setTimeout(fn, ms); addC(function () { clearTimeout(id); }); return id; }
    function every(fn, ms) { var id = setInterval(fn, ms); addC(function () { clearInterval(id); }); }
    function frames(fn) {
        var id, alive = true, last = 0;
        function loop(t) {
            if (!alive) return;
            var dt = last ? Math.min(0.05, (t - last) / 1000) : 0.016; last = t;
            fn(dt); id = requestAnimationFrame(loop);
        }
        id = requestAnimationFrame(loop);
        addC(function () { alive = false; cancelAnimationFrame(id); });
    }
    function rnd(a, b) { return Math.floor(a + Math.random() * (b - a)); }
    function mk(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function setA(v) { leftEl.textContent = v; }
    function setB(v) { timeEl.textContent = v; }
    function labels(l) { l1El.textContent = l[0]; l2El.textContent = l[1]; u2El.textContent = l[2]; }
    function hit(el, fn) { el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(e); }); }
    function floatText(e, text, color) {
        var r = board.getBoundingClientRect();
        var f = mk('div', 'mp-float', text); f.style.color = color || '#16a34a';
        f.style.left = (e.clientX - r.left - 14) + 'px'; f.style.top = (e.clientY - r.top - 20) + 'px';
        board.appendChild(f); setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 700);
    }
    function bestKey() { return 'mp_best_' + mode; }
    function readBest() { try { var v = parseFloat(localStorage.getItem(bestKey())); return isNaN(v) ? null : v; } catch (e) { return null; } }
    function saveBest(val, lower) {
        try {
            if (!lower && val <= 0) return false;
            var old = readBest();
            var isNew = old === null || (lower ? val < old : val > old);
            if (isNew) localStorage.setItem(bestKey(), val);
            return isNew;
        } catch (e) { return false; }
    }
    function bestLine() {
        var g = G[mode], v = g ? readBest() : null;
        return v === null ? '' : '<br>🏅 내 최고 기록: ' + v + g.unit;
    }
    function message(big, small, btn) {
        board.innerHTML = '<div class="mp-msg"><div class="big">' + big + '</div><div>' + small + '</div><button class="mp-start" id="mpStart">' + btn + '</button></div>';
        document.getElementById('mpStart').onclick = start;
    }
    function endGame(big, small, val, lower) {
        stopAll(); running = false; clearInterval(timer);
        var isNew = saveBest(val, lower);
        message(big, small + (isNew ? '<br>🏅 새 최고 기록이에요!' : ''), '다시 하기');
    }
    function countdown(sec, onEnd) {
        var end = Date.now() + sec * 1000; setB(sec);
        every(function () {
            var r = Math.ceil((end - Date.now()) / 1000); setB(Math.max(0, r));
            if (r <= 0) onEnd();
        }, 200);
    }
    function countUp() { var s = Date.now(); setB('0.0'); every(function () { setB(((Date.now() - s) / 1000).toFixed(1)); }, 100); return function () { return ((Date.now() - s) / 1000).toFixed(1); }; }
    function endTimed(score) {
        var cheer = score >= 20 ? '🏆 대단해요! 마우스 박사님이에요!' : score >= 10 ? '🎉 잘했어요! 정말 멋져요!' : '💪 괜찮아요! 다시 하면 더 잘할 수 있어요. 힘내요!';
        endGame(cheer, '30초 동안 ' + score + '점을 얻었어요', score, false);
    }

    /* ---------- 클릭 게임들 ---------- */
    var TIMED = ['점수', '남은 시간', '초'];
    var G = {};

    // 🔨 두더지 잡기
    G.mole = { labels: TIMED, a0: 0, b0: 30, unit: '점', run: function () {
        var score = 0, last = -1, holes = [];
        setA(0); board.innerHTML = '';
        var grid = mk('div', 'mp-grid');
        for (var i = 0; i < 9; i++) {
            var h = mk('div', 'mp-hole'), m = mk('div', 'mp-mole', '🐹'); h.appendChild(m); grid.appendChild(h);
            holes.push({ m: m, up: false, tid: 0 });
        }
        board.appendChild(grid);
        function hide(s) { s.up = false; s.m.classList.remove('up'); }
        function pop() {
            var i; do { i = rnd(0, 9); } while (i === last); last = i;
            var s = holes[i]; s.up = true; s.m.classList.add('up');
            s.tid = after(function () { hide(s); after(pop, 450); }, 1500);
        }
        holes.forEach(function (s) {
            hit(s.m.parentNode, function (e) {
                if (!s.up) return;
                clearTimeout(s.tid); hide(s); score++; setA(score); floatText(e, '+1');
                after(pop, 350);
            });
        });
        countdown(30, function () { endTimed(score); });
        after(pop, 400);
    } };

    // 🎈 풍선 터뜨리기
    G.balloon = { labels: TIMED, a0: 0, b0: 30, unit: '점', run: function () {
        var score = 0, list = [], W = board.clientWidth, H = board.clientHeight;
        setA(0); board.innerHTML = '';
        function spawn() {
            var el = mk('div', 'mp-emoji', '🎈'); el.style.fontSize = '72px';
            el.style.filter = 'hue-rotate(' + rnd(0, 360) + 'deg)';
            var b = { el: el, x: rnd(8, Math.max(9, W - 90)), y: H + 10, v: rnd(55, 80), dead: false };
            el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
            hit(el, function (e) {
                if (b.dead) return; b.dead = true; score++; setA(score); floatText(e, '+1');
                el.textContent = '💥'; el.style.filter = 'none';
                setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 250);
            });
            board.appendChild(el); list.push(b);
        }
        every(spawn, 900); spawn();
        frames(function (dt) {
            list = list.filter(function (b) {
                if (b.dead) return false;
                b.y -= b.v * dt; b.el.style.top = b.y + 'px';
                if (b.y < -90) { if (b.el.parentNode) b.el.parentNode.removeChild(b.el); return false; }
                return true;
            });
        });
        countdown(30, function () { endTimed(score); });
    } };

    // 🍎 과일 골라 누르기
    G.fruit = { labels: TIMED, a0: 0, b0: 30, unit: '점', run: function () {
        var score = 0, W = board.clientWidth, H = board.clientHeight, FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉'];
        setA(0); board.innerHTML = '';
        function spawn() {
            var bomb = Math.random() < 0.2;
            var el = mk('div', 'mp-emoji', bomb ? '💣' : FRUITS[rnd(0, FRUITS.length)]); el.style.fontSize = '64px';
            el.style.left = rnd(8, Math.max(9, W - 80)) + 'px'; el.style.top = rnd(8, Math.max(9, H - 80)) + 'px';
            function remove() { if (el.parentNode) el.parentNode.removeChild(el); }
            hit(el, function (e) {
                if (bomb) {
                    score = Math.max(0, score - 1); setA(score); floatText(e, '-1', '#dc2626');
                    board.classList.add('mp-shake'); setTimeout(function () { board.classList.remove('mp-shake'); }, 300);
                } else { score++; setA(score); floatText(e, '+1'); }
                remove();
            });
            board.appendChild(el); after(remove, 2800);
        }
        every(spawn, 950); spawn();
        countdown(30, function () { endTimed(score); });
    } };

    // 🔢 숫자 순서대로
    G.numbers = { labels: ['다음 숫자', '시간', '초'], a0: 1, b0: '0.0', unit: '초', run: function () {
        var N = 10, next = 1, W = board.clientWidth, H = board.clientHeight, pts = [];
        setA(1); board.innerHTML = '';
        var elapsed = countUp();
        for (var n = 1; n <= N; n++) {
            var x, y, tries = 0;
            do { x = rnd(10, W - 74); y = rnd(10, H - 74); tries++; }
            while (tries < 300 && pts.some(function (p) { return Math.abs(p[0] - x) < 80 && Math.abs(p[1] - y) < 80; }));
            pts.push([x, y]);
            (function (n, x, y) {
                var el = mk('div', 'mp-num', n); el.style.left = x + 'px'; el.style.top = y + 'px';
                hit(el, function () {
                    if (n !== next) { el.classList.add('mp-shake'); setTimeout(function () { el.classList.remove('mp-shake'); }, 300); return; }
                    el.classList.add('ok'); next++; setA(next > N ? '끝!' : next);
                    if (next > N) {
                        var sec = parseFloat(elapsed());
                        endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '1부터 ' + N + '까지 모두 눌렀어요', sec, true);
                    }
                });
                board.appendChild(el);
            })(n, x, y);
        }
    } };

    // 🎯 과녁 맞히기
    G.target = { labels: ['남은 과녁', '점수', '점'], a0: 10, b0: 0, unit: '점', run: function () {
        var ROUNDS = 10, round = 0, total = 0, W = board.clientWidth, H = board.clientHeight;
        setA(ROUNDS); setB(0);
        function show() {
            board.innerHTML = '';
            var size = 160 - round * 8;
            var el = mk('div', 'mp-bull'); el.style.width = el.style.height = size + 'px';
            el.style.left = rnd(10, W - size - 10) + 'px'; el.style.top = rnd(10, H - size - 10) + 'px';
            hit(el, function (e) {
                var r = el.getBoundingClientRect();
                var d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2)) / (r.width / 2);
                var p = d <= 0.2 ? 10 : d <= 0.4 ? 7 : d <= 0.6 ? 4 : 2;
                total += p; round++; setB(total); setA(ROUNDS - round);
                floatText(e, '+' + p, p >= 7 ? '#dc2626' : '#2563eb');
                el.style.pointerEvents = 'none';
                if (round >= ROUNDS) {
                    var cheer = total >= 70 ? '🏆 대단해요! 명사수예요!' : total >= 45 ? '🎉 잘했어요! 정말 멋져요!' : '💪 괜찮아요! 가운데를 노려 보면 더 잘할 수 있어요!';
                    after(function () { endGame(cheer, '10번 쏴서 ' + total + '점을 얻었어요 (100점 만점)', total, false); }, 500);
                } else after(show, 350);
            });
            board.appendChild(el);
        }
        show();
    } };

    // 🃏 짝 맞추기
    G.memory = { labels: ['남은 짝', '시간', '초'], a0: 4, b0: '0.0', unit: '초', run: function () {
        var icons = ['🐶', '🐱', '🐰', '🐻'], deck = icons.concat(icons), pairs = 4, first = null, lock = false, moves = 0;
        for (var i = deck.length - 1; i > 0; i--) { var j = rnd(0, i + 1), t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
        setA(pairs); board.innerHTML = '';
        var elapsed = countUp(), grid = mk('div', 'mp-cards');
        deck.forEach(function (ic) {
            var c = mk('div', 'mp-card', '❓'); c.dataset.ic = ic; grid.appendChild(c);
            hit(c, function () {
                if (lock || c.classList.contains('open') || c.classList.contains('matched')) return;
                c.classList.add('open'); c.textContent = ic;
                if (!first) { first = c; return; }
                moves++;
                if (first.dataset.ic === ic) {
                    first.classList.add('matched'); c.classList.add('matched'); first = null; pairs--; setA(pairs);
                    if (pairs === 0) {
                        var sec = parseFloat(elapsed());
                        after(function () { endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '카드를 ' + moves + '번 뒤집어서 모두 찾았어요', sec, true); }, 500);
                    }
                } else {
                    lock = true; var a = first; first = null;
                    after(function () { a.classList.remove('open'); a.textContent = '❓'; c.classList.remove('open'); c.textContent = '❓'; lock = false; }, 800);
                }
            });
        });
        board.appendChild(grid);
    } };

    // 🐛 벌레 잡기
    G.bug = { labels: ['남은 벌레', '시간', '초'], a0: 5, b0: '0.0', unit: '초', run: function () {
        var COUNT = 5, HP = 3, alive = COUNT, W = board.clientWidth, H = board.clientHeight, S = 56, bugs = [];
        setA(COUNT); board.innerHTML = '';
        var elapsed = countUp();
        for (var i = 0; i < COUNT; i++) {
            (function () {
                var el = mk('div', 'mp-emoji', '🐛'); el.style.fontSize = S + 'px';
                var ang = Math.random() * Math.PI * 2, sp = rnd(45, 70);
                var b = { el: el, x: rnd(10, W - S - 10), y: rnd(10, H - S - 10), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, hp: HP, dead: false };
                el.style.left = b.x + 'px'; el.style.top = b.y + 'px';
                hit(el, function (e) {
                    if (b.dead) return; b.hp--;
                    el.style.opacity = 0.4 + 0.2 * b.hp;
                    if (b.hp <= 0) {
                        b.dead = true; alive--; setA(alive); floatText(e, '잡았다!'); el.textContent = '💨';
                        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
                        if (alive === 0) {
                            var sec = parseFloat(elapsed());
                            after(function () { endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '벌레를 모두 잡았어요', sec, true); }, 400);
                        }
                    } else floatText(e, b.hp + '번 더!', '#d97706');
                });
                board.appendChild(el); bugs.push(b);
            })();
        }
        frames(function (dt) {
            bugs.forEach(function (b) {
                if (b.dead) return;
                b.x += b.vx * dt; b.y += b.vy * dt;
                if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx); } else if (b.x > W - S) { b.x = W - S; b.vx = -Math.abs(b.vx); }
                if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy); } else if (b.y > H - S) { b.y = H - S; b.vy = -Math.abs(b.vy); }
                b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
            });
        });
    } };

    /* ---------- 더블클릭 게임들 ---------- */
    function dbl(el, fn) { el.addEventListener('dblclick', function (e) { e.preventDefault(); fn(e); }); }
    function scatter(n, size, W, H, pts) {
        var out = [];
        for (var i = 0; i < n; i++) {
            var x, y, t = 0;
            do { x = rnd(10, W - size - 10); y = rnd(10, H - size - 10); t++; }
            while (t < 300 && out.some(function (p) { return Math.abs(p[0] - x) < size + 14 && Math.abs(p[1] - y) < size + 14; }));
            out.push([x, y]);
        }
        return out;
    }

    // 🥚 알 깨기
    G.egg = { labels: TIMED, a0: 0, b0: 30, unit: '점', run: function () {
        var score = 0, W = board.clientWidth, H = board.clientHeight;
        setA(0); board.innerHTML = '';
        function spawn() {
            var el = mk('div', 'mp-emoji', '🥚'); el.style.fontSize = '64px';
            el.style.left = rnd(8, Math.max(9, W - 80)) + 'px'; el.style.top = rnd(8, Math.max(9, H - 80)) + 'px';
            var cracked = false;
            function remove() { if (el.parentNode) el.parentNode.removeChild(el); }
            dbl(el, function (e) {
                if (cracked) return; cracked = true; score++; setA(score); floatText(e, '+1'); el.textContent = '🐣';
                setTimeout(remove, 400);
            });
            board.appendChild(el); after(remove, 3500);
        }
        every(spawn, 1300); spawn();
        countdown(30, function () { endTimed(score); });
    } };

    // 🎁 선물 열기
    G.gift = { labels: ['남은 선물', '시간', '초'], a0: 8, b0: '0.0', unit: '초', run: function () {
        var N = 8, open = 0, W = board.clientWidth, H = board.clientHeight;
        setA(N); board.innerHTML = '';
        var elapsed = countUp();
        scatter(N, 72, W, H).forEach(function (p) {
            var el = mk('div', 'mp-emoji', '🎁'); el.style.fontSize = '68px'; el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px';
            var done = false;
            dbl(el, function (e) {
                if (done) return; done = true; open++; setA(N - open); el.textContent = '🌟'; el.style.opacity = 0.5; el.style.cursor = 'default';
                floatText(e, '짠!');
                if (open === N) {
                    var sec = parseFloat(elapsed());
                    after(function () { endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '선물 상자를 모두 열었어요', sec, true); }, 500);
                }
            });
            board.appendChild(el);
        });
    } };

    // 🍿 팝콘 터뜨리기
    G.popcorn = { labels: TIMED, a0: 0, b0: 30, unit: '점', run: function () {
        var score = 0;
        setA(0); board.innerHTML = '';
        var grid = mk('div', 'mp-cards'); grid.style.gridTemplateColumns = 'repeat(4, var(--cs))';
        for (var i = 0; i < 12; i++) {
            (function () {
                var c = mk('div', 'mp-card', '🌽'); c.style.background = '#fef3c7'; c.style.borderColor = '#f59e0b';
                c.style.height = 'calc(var(--cs) * 0.9)';
                var busy = false;
                dbl(c, function (e) {
                    if (busy) return; busy = true; score++; setA(score); floatText(e, '+1'); c.textContent = '🍿';
                    after(function () { c.textContent = '🌽'; busy = false; }, 700);
                });
                grid.appendChild(c);
            })();
        }
        board.appendChild(grid);
        countdown(30, function () { endTimed(score); });
    } };

    /* ---------- 드래그 게임들 ---------- */
    function draggable(el, onDrop) {
        var home = [el.offsetLeft, el.offsetTop], sx = 0, sy = 0, ox = 0, oy = 0, on = false;
        el.style.touchAction = 'none'; el.style.cursor = 'grab';
        el.addEventListener('pointerdown', function (e) {
            e.preventDefault(); on = true; el.setPointerCapture(e.pointerId);
            sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; el.style.zIndex = 3; el.style.cursor = 'grabbing';
        });
        el.addEventListener('pointermove', function (e) {
            if (!on) return;
            el.style.left = Math.max(0, Math.min(board.clientWidth - el.offsetWidth, ox + e.clientX - sx)) + 'px';
            el.style.top = Math.max(0, Math.min(board.clientHeight - el.offsetHeight, oy + e.clientY - sy)) + 'px';
        });
        el.addEventListener('pointerup', function () {
            if (!on) return; on = false; el.style.zIndex = ''; el.style.cursor = 'grab';
            var ok = onDrop(el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2, el);
            if (!ok) { el.style.left = home[0] + 'px'; el.style.top = home[1] + 'px'; }
        });
    }
    function inside(cx, cy, z) { return cx > z.offsetLeft && cx < z.offsetLeft + z.offsetWidth && cy > z.offsetTop && cy < z.offsetTop + z.offsetHeight; }
    function zoneBox(text, color, left, top, w, h, fs) {
        var z = mk('div', 'mp-zone', text); z.style.width = w + 'px'; z.style.height = h + 'px';
        z.style.left = left + 'px'; z.style.top = top + 'px'; z.style.borderColor = color; z.style.color = color; z.style.fontSize = (fs || 36) + 'px';
        return z;
    }

    // 🧺 과일 바구니
    G.basket = { labels: ['남은 과일', '시간', '초'], a0: 10, b0: '0.0', unit: '초', run: function () {
        var N = 10, left = N, W = board.clientWidth, H = board.clientHeight, FR = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉'];
        setA(N); board.innerHTML = '';
        var elapsed = countUp();
        var bw = 150, bh = 100, bsk = zoneBox('🧺', '#16a34a', Math.round((W - bw) / 2), H - bh - 10, bw, bh, 56);
        board.appendChild(bsk);
        scatter(N, 60, W, H - bh - 30).forEach(function (p, i) {
            var el = mk('div', 'mp-emoji', FR[i % FR.length]); el.style.fontSize = '52px'; el.style.width = '60px'; el.style.height = '60px';
            el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px';
            board.appendChild(el);
            draggable(el, function (cx, cy) {
                if (!inside(cx, cy, bsk)) return false;
                el.style.display = 'none'; left--; setA(left); floatText({ clientX: board.getBoundingClientRect().left + cx, clientY: board.getBoundingClientRect().top + cy }, '+1');
                if (left === 0) { var sec = parseFloat(elapsed()); after(function () { endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '과일을 모두 바구니에 담았어요', sec, true); }, 400); }
                return true;
            });
        });
    } };

    // 🎨 색깔 분류
    G.sort = { labels: ['남은 공', '시간', '초'], a0: 8, b0: '0.0', unit: '초', run: function () {
        var N = 8, left = N, W = board.clientWidth, H = board.clientHeight;
        setA(N); board.innerHTML = '';
        var elapsed = countUp();
        var zw = Math.min(150, Math.floor((W - 50) / 2)), zh = 110;
        var red = zoneBox('빨강', '#dc2626', 15, H - zh - 10, zw, zh, 20), blue = zoneBox('파랑', '#2563eb', W - zw - 15, H - zh - 10, zw, zh, 20);
        board.appendChild(red); board.appendChild(blue);
        scatter(N, 56, W, H - zh - 30).forEach(function (p, i) {
            var isRed = i % 2 === 0;
            var el = mk('div', 'mp-emoji', isRed ? '🔴' : '🔵'); el.style.fontSize = '48px'; el.style.width = '56px'; el.style.height = '56px';
            el.style.left = p[0] + 'px'; el.style.top = p[1] + 'px';
            board.appendChild(el);
            draggable(el, function (cx, cy) {
                var z = isRed ? red : blue, other = isRed ? blue : red;
                if (inside(cx, cy, other)) { board.classList.add('mp-shake'); setTimeout(function () { board.classList.remove('mp-shake'); }, 300); return false; }
                if (!inside(cx, cy, z)) return false;
                el.style.display = 'none'; left--; setA(left);
                if (left === 0) { var sec = parseFloat(elapsed()); after(function () { endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '공을 색깔대로 모두 옮겼어요', sec, true); }, 400); }
                return true;
            });
        });
    } };

    // 🔢 숫자 칸 맞추기
    G.slots = { labels: ['남은 숫자', '시간', '초'], a0: 5, b0: '0.0', unit: '초', run: function () {
        var N = 5, left = N, W = board.clientWidth, H = board.clientHeight, S = 60, gap = Math.max(6, Math.floor((W - N * S) / (N + 1)));
        setA(N); board.innerHTML = '';
        var elapsed = countUp(), slots = [], order = [1, 2, 3, 4, 5];
        for (var i = order.length - 1; i > 0; i--) { var j = rnd(0, i + 1), t = order[i]; order[i] = order[j]; order[j] = t; }
        for (var n = 1; n <= N; n++) {
            var z = zoneBox(n, '#94a3b8', gap + (n - 1) * (S + gap), 50, S, S, 26); z.style.borderRadius = '12px'; z.style.opacity = 0.7;
            board.appendChild(z); slots.push(z);
        }
        order.forEach(function (n, k) {
            var el = mk('div', 'mp-num', n); el.style.left = (gap + k * (S + gap)) + 'px'; el.style.top = (H - S - 60) + 'px';
            el.style.width = el.style.height = S + 'px'; el.style.cursor = 'grab';
            board.appendChild(el);
            draggable(el, function (cx, cy) {
                var z = slots[n - 1];
                if (!inside(cx, cy, z)) {
                    if (slots.some(function (o) { return inside(cx, cy, o); })) { board.classList.add('mp-shake'); setTimeout(function () { board.classList.remove('mp-shake'); }, 300); }
                    return false;
                }
                el.style.left = z.offsetLeft + 'px'; el.style.top = z.offsetTop + 'px'; el.style.pointerEvents = 'none'; el.classList.add('ok'); el.style.opacity = 1;
                left--; setA(left);
                if (left === 0) { var sec = parseFloat(elapsed()); after(function () { endGame('🎉 잘했어요! ' + sec.toFixed(1) + '초', '숫자를 모두 맞췄어요', sec, true); }, 400); }
                return true;
            });
        });
    } };

    /* ---------- 기본 연습(클릭·더블클릭·드래그) ---------- */
    function reset() {
        running = false; clearInterval(timer); stopAll();
        var g = G[mode];
        labels(g ? g.labels : DEFAULT_LABELS);
        if (g) { setA(g.a0); setB(g.b0); }
        else { left = TOTAL; setA(TOTAL); setB('0.0'); }
        var help = HELP[mode] + bestLine();
        if (BASIC[mode] && !passed(mode)) help += '<br>🎮 ' + BASIC[mode].name + ' 연습을 통과하면 재미있는 ' + BASIC[mode].name + ' 게임이 열려요!';
        showGames();
        message('준비되셨나요?', help, '시작하기');
    }
    var BASIC = {
        click: { name: '클릭', box: document.getElementById('mpGames') },
        dbl: { name: '더블클릭', box: document.getElementById('mpGamesDbl') },
        drag: { name: '드래그', box: document.getElementById('mpGamesDrag') }
    };
    function passed(m) { try { return localStorage.getItem('mp_' + m + '_passed') === '1'; } catch (e) { return false; } }
    // 지금 보고 있는 연습(또는 게임)이 속한 묶음의 게임 목록만 보여준다
    function ownerOf(m) {
        if (BASIC[m]) return m;
        var btn = document.querySelector('.mp-tab[data-mode="' + m + '"]');
        return Object.keys(BASIC).filter(function (k) { return btn && BASIC[k].box.contains(btn); })[0];
    }
    function showGames() { var cur = ownerOf(mode); Object.keys(BASIC).forEach(function (m) { BASIC[m].box.style.display = (m === cur && passed(m)) ? '' : 'none'; }); }
    function finish() {
        running = false; clearInterval(timer);
        var sec = ((Date.now() - t0) / 1000).toFixed(1);
        timeEl.textContent = sec;
        var b = BASIC[mode];
        var first = !passed(mode);
        try { localStorage.setItem('mp_' + mode + '_passed', '1'); } catch (e) {}
        showGames();
        message('🎉 ' + b.name + ' 연습 통과! ' + sec + '초',
            first ? '🎮 <b>' + b.name + ' 게임</b>이 열렸어요!<br>아래에서 하고 싶은 게임을 골라 보세요.' : '아래 ' + b.name + ' 게임도 해 보세요!', '다시 하기');
    }
    function start() {
        stopAll();
        if (G[mode]) { running = true; G[mode].run(); return; }
        running = true; left = TOTAL; leftEl.textContent = left; t0 = Date.now();
        clearInterval(timer);
        timer = setInterval(function () { timeEl.textContent = ((Date.now() - t0) / 1000).toFixed(1); }, 100);
        next();
    }
    function done() {
        left--; leftEl.textContent = left;
        if (left <= 0) finish(); else next();
    }
    function next() {
        board.innerHTML = '';
        var W = board.clientWidth, H = board.clientHeight;
        if (mode === 'drag') return nextDrag(W, H);
        var el = document.createElement('div');
        el.className = 'mp-target' + (mode === 'dbl' ? ' dbl' : '');
        el.style.left = rnd(10, W - 74) + 'px'; el.style.top = rnd(10, H - 74) + 'px';
        if (mode === 'dbl') el.addEventListener('dblclick', done); else el.addEventListener('click', done);
        board.appendChild(el);
    }
    function nextDrag(W, H) {
        var zone = document.createElement('div'); zone.className = 'mp-zone'; zone.textContent = '여기에!';
        var zl = rnd(10, W - 110), zt = rnd(10, H - 110);
        zone.style.left = zl + 'px'; zone.style.top = zt + 'px';
        var box = document.createElement('div'); box.className = 'mp-drag';
        var bl, bt;
        do { bl = rnd(10, W - 70); bt = rnd(10, H - 70); } while (Math.abs(bl - zl) < 130 && Math.abs(bt - zt) < 130);
        box.style.left = bl + 'px'; box.style.top = bt + 'px';
        board.appendChild(zone); board.appendChild(box);
        var dx = 0, dy = 0, drag = false;
        box.addEventListener('pointerdown', function (e) {
            drag = true; box.setPointerCapture(e.pointerId); box.style.cursor = 'grabbing';
            dx = e.clientX - box.offsetLeft; dy = e.clientY - box.offsetTop;
        });
        box.addEventListener('pointermove', function (e) {
            if (!drag) return;
            box.style.left = Math.max(0, Math.min(W - 60, e.clientX - dx)) + 'px';
            box.style.top = Math.max(0, Math.min(H - 60, e.clientY - dy)) + 'px';
        });
        box.addEventListener('pointerup', function () {
            if (!drag) return; drag = false; box.style.cursor = 'grab';
            var cx = box.offsetLeft + 30, cy = box.offsetTop + 30;
            if (cx > zl && cx < zl + 100 && cy > zt && cy < zt + 100) done();
        });
    }
    document.querySelectorAll('.mp-tab').forEach(function (b) {
        b.addEventListener('click', function () {
            document.querySelectorAll('.mp-tab').forEach(function (x) { x.classList.remove('active'); });
            b.classList.add('active'); mode = b.dataset.mode; reset();
        });
    });
    reset();
})();
</script>
