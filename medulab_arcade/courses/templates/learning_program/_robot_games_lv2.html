<script>
/* 올로AI 2단계 과학 게임 12종 (공통 틀: _robot_games.html) */
(function () {
    // ① 모터: 전기로 움직이는 짐 승강기
    RG('motor', {
        stages: ['▲▼ 로 모터를 돌려 짐을 노란 층에 맞추고 [내려놓기]. 모터 힘(전압)도 조절해요. 3번 배달!', '전지가 적어요. 낭비하지 말고 3번 배달!', '무거운 짐은 올라갈 때 전기를 더 쓰고, 내려갈 때 더 빨라져요. 3번 배달!'],
        tips: ['모터는 전기 에너지를 회전하는 힘으로 바꿔요. 도르래에 줄이 감기며 짐이 올라가요.', '전압을 높이면 빨리 돌지만 전지가 빨리 닳아요. 끝에서는 천천히 맞추는 것이 좋아요.', '무거운 것을 들어 올릴수록 에너지가 더 필요해요.'],
        make: function (api, lv) {
            var floors = [372, 296, 220, 144], y = 372, v = 0, spin = 0, bat = 100, got = 0, target = 2, weight = 1;
            var volt = api.slider('⚡ 모터 힘', 1, 5, 3);
            api.button({ t: '▲ 올리기', key: 'ArrowUp' }); api.button({ t: '▼ 내리기', key: 'ArrowDown' });
            function next() { var t; do { t = api.pick([0, 1, 2, 3]); } while (Math.abs(floors[t] - y) < 60); target = t; weight = lv === 2 ? api.pick([1, 2, 3]) : 1; }
            api.button({ t: '📦 내려놓기', key: 'Space', cls: 'go', down: function () {
                var gap = Math.abs(y - floors[target]);
                if (gap <= 9 && Math.abs(v) < 25) { got++; api.add(60 + Math.round((9 - gap) * 5)); api.sfx('good'); api.burst(470, y - 20); api.say('배달 성공!', true); if (got >= 3) api.win('짐 3개를 배달했어요! 남은 전지 ' + Math.round(bat) + '%'); else next(); }
                else api.hurt(gap > 9 ? '층 높이가 맞지 않아요.' : '아직 움직이고 있어요. 멈춘 뒤에!');
            } });
            next();
            return {
                step: function (dt) {
                    var dir = api.held('ArrowUp') ? -1 : api.held('ArrowDown') ? 1 : 0, p = volt.get();
                    var want = bat > 0 ? dir * p * 38 * (lv === 2 ? (dir < 0 ? 1.2 - weight * 0.2 : 0.8 + weight * 0.25) : 1) : 0;
                    v += (want - v) * Math.min(1, dt * 7); y = api.clamp(y + v * dt, 130, 372); spin += -v * dt * 0.12;
                    if (dir) { bat -= dt * p * [1.1, 2.1, 1.3][lv] * (lv === 2 && dir < 0 ? weight : 1); if (Math.random() < dt * 14) api.tone(90 + p * 25, 0.05, 0, 'square', 0.03); }
                    if (bat <= 0) api.fail('전지가 다 닳았어요. 꼭 필요한 만큼만 모터를 돌려요.');
                },
                draw: function () {
                    var g = api.g; api.clear('#e0e7ff', '#f8fafc'); api.rect(0, 400, api.W, 40, '#78716c');
                    floors.forEach(function (f, i) { api.rect(520, f + 14, 180, 10, i === target ? '#facc15' : '#94a3b8', 4); api.text((i + 1) + '층', 660, f, 18); if (i === target) api.emoji('🏠', 570, f - 8, 40); });
                    api.rect(340, 70, 16, 330, '#475569'); api.rect(340, 70, 160, 14, '#475569');
                    g.save(); g.translate(470, 78); g.rotate(spin); api.circle(0, 0, 26, '#1f2937', '#e5e7eb', 4); api.line([[-22, 0], [22, 0]], '#facc15', 5); api.line([[0, -22], [0, 22]], '#facc15', 5); g.restore();
                    api.line([[470, 104], [470, y - 34]], '#292524', 3); api.rect(428, y + 4, 90, 12, '#334155', 4); api.emoji(weight === 3 ? '🧱' : weight === 2 ? '🗄️' : '📦', 470, y - 16, 34 + weight * 6);
                    if (lv === 2) api.text('무게 ' + weight, 470, y + 30, 14);
                    api.emoji('🔋', 70, 130, 54); api.bar(110, 118, 180, 24, bat / 100, bat < 25 ? '#dc2626' : '#22c55e', Math.round(bat) + '%');
                    api.rect(40, 180, 260, 120, '#fff', 16); api.text('전기 ⚡ → 모터 🔄 → 움직임 ⬆', 170, 210, 16); api.text('모터 속도 ' + Math.round(Math.abs(v)), 170, 244, 18, '#1d4ed8'); api.text(v < -3 ? '감는 중 (올라감)' : v > 3 ? '푸는 중 (내려감)' : '정지', 170, 276, 17, '#b45309');
                    api.hud('배달 ' + got + ' / 3');
                }
            };
        }
    });

    // ② 집게: 힘 조절 집게 크레인
    RG('grip', {
        stages: ['◀▶ 로 집게를 옮기고, 잡는 힘을 골라 [집기]! 바구니까지 3개를 옮기세요.', '4개! 약한 물건은 살살, 무거운 물건은 꽉!', '5개! 컨베이어가 움직여요.'],
        tips: ['집게의 힘이 너무 약하면 미끄러지고, 너무 세면 약한 물건이 부서져요.', '로봇 손은 물건에 따라 힘을 조절해야 해요. 그래서 센서를 달기도 해요.', '집게는 지레의 원리로 모터의 힘을 손끝까지 전달해요.'],
        make: function (api, lv) {
            var kinds = [['🥚', '달걀', 1], ['🎈', '풍선', 1], ['🧸', '곰 인형', 2], ['🍎', '사과', 2], ['🧱', '벽돌', 3], ['🔩', '쇳덩이', 3]];
            var need = 3 + lv, got = 0, cx = 120, cy = 100, state = 'free', held = null, item, drop = 0;
            var power = api.slider('✊ 잡는 힘', 1, 3, 2);
            api.button({ t: '◀', key: 'ArrowLeft' }); api.button({ t: '▶', key: 'ArrowRight' });
            api.button({ t: '🤏 집기 / 놓기', key: 'Space', cls: 'go', down: function () {
                if (state === 'free') { state = 'down'; api.sfx('pop'); }
                else if (state === 'carry') {
                    if (cx > 575) { got++; api.add(50); api.sfx('good'); api.burst(640, 340); api.say('바구니에 쏙!', true); held = null; state = 'free'; if (got >= need) api.win(need + '개를 안전하게 옮겼어요!'); else spawn(); }
                    else api.say('바구니(오른쪽)까지 가서 놓아요.');
                }
            } });
            function spawn() { var k = api.pick(kinds); item = { e: k[0], n: k[1], p: k[2], x: api.rnd(110, 460), dir: api.pick([-1, 1]) }; }
            spawn();
            return {
                step: function (dt) {
                    var mx = (api.held('ArrowRight') ? 1 : 0) - (api.held('ArrowLeft') ? 1 : 0); if (state === 'free' || state === 'carry') cx = api.clamp(cx + mx * 210 * dt, 60, 660);
                    if (lv === 2 && !held && drop <= 0) { item.x += item.dir * 70 * dt; if (item.x < 90 || item.x > 490) item.dir *= -1; }
                    if (state === 'down') { cy += 330 * dt; if (cy >= 318) { cy = 318; if (Math.abs(cx - item.x) < 34) {
                        if (power.get() < item.p) { api.hurt(item.n + '이(가) 미끄러졌어요. 힘이 약해요.'); }
                        else if (power.get() > item.p && item.p === 1) { api.burst(item.x, 340, '#facc15', 30); api.hurt('빠직! ' + item.n + '은(는) 살살 잡아야 해요.'); if (api.playing()) spawn(); }
                        else { held = item; api.sfx('good'); }
                    } else api.say('빈 곳이에요. 물건 바로 위에서 집어요.'); state = 'up'; } }
                    else if (state === 'up') { cy -= 270 * dt; if (cy <= 100) { cy = 100; state = held ? 'carry' : 'free'; } }
                },
                draw: function () {
                    api.clear('#fce7f3', '#fdf2f8'); api.rect(0, 362, api.W, 78, '#64748b'); if (lv === 2) for (var i = 0; i < 14; i++) api.circle(40 + i * 40, 372, 8, '#1f2937');
                    api.rect(30, 58, 660, 14, '#475569', 6); api.rect(592, 326, 108, 52, '#b45309', 10); api.text('바구니', 646, 354, 17, '#fff'); api.emoji('🧺', 646, 308, 46);
                    api.line([[cx, 72], [cx, cy - 26]], '#334155', 5); api.rect(cx - 24, cy - 34, 48, 22, '#2563eb', 8);
                    var open = held ? 20 : 34; api.line([[cx - 14, cy - 14], [cx - open - 6, cy + 10], [cx - open + 8, cy + 36]], '#1e293b', 8); api.line([[cx + 14, cy - 14], [cx + open + 6, cy + 10], [cx + open - 8, cy + 36]], '#1e293b', 8);
                    if (held) api.emoji(held.e, cx, cy + 26, 44); else { api.emoji(item.e, item.x, 338, 46); api.rect(item.x - 46, 382, 92, 26, '#fff', 13); api.text(item.n, item.x, 396, 15); }
                    api.rect(40, 96, 190, 74, 'rgba(255,255,255,.85)', 14); api.text('1 살살 · 2 보통 · 3 꽉', 135, 120, 15); api.bar(60, 138, 150, 20, power.get() / 3, ['#22c55e', '#f59e0b', '#ef4444'][power.get() - 1]);
                    api.hud('옮긴 물건 ' + got + ' / ' + need);
                }
            };
        }
    });

    // ③ 소리: 물개 박수 리듬
    RG('sound', {
        stages: ['물개의 박수를 듣고 똑같이 [👏 짝!] 하세요. 3번 성공!', '긴 쉼과 짧은 쉼이 섞여요. 빠르기까지 따라 해요.', '더 긴 리듬! 3번 성공하면 박수 대장!'],
        tips: ['손뼉을 치면 공기가 떨려 소리가 퍼져요. 로봇은 마이크로 이 떨림을 듣고 횟수를 세요.', '소리 사이의 시간 간격이 리듬이에요. 컴퓨터도 시간을 재서 구별해요.', '소리가 들어오는 순간을 하나씩 기억하면 긴 신호도 따라 할 수 있어요.'],
        make: function (api, lv) {
            var rounds = 0, pattern, state = 'idle', t = 0, idx = 0, taps = [], rings = [], clapAt = 0;
            function makePattern() { var n = [3, 4, 5][lv] + (rounds === 2 ? 1 : 0), p = [0]; for (var i = 1; i < n; i++) p.push(p[i - 1] + (lv === 0 ? 0.55 : api.pick([0.35, 0.7]))); pattern = p; }
            function ring(x, color) { rings.push({ x: x, r: 20, c: color }); api.sfx('clap'); }
            api.button({ t: '👂 물개 박수 듣기', down: function () { if (state === 'listen') return; state = 'listen'; t = -0.4; idx = 0; taps = []; api.say('잘 들어요…'); } });
            api.button({ t: '👏 짝!', key: 'Space', cls: 'go', down: function () {
                if (state !== 'turn') return api.say(state === 'listen' ? '물개가 다 칠 때까지 기다려요.' : '먼저 [물개 박수 듣기]를 눌러요.');
                taps.push(t); ring(520, '#f59e0b'); clapAt = t;
                if (taps.length === pattern.length) check();
            } });
            function check() {
                var ok = pattern.every(function (p, i) { return Math.abs((taps[i] - taps[0]) - p) <= [0.45, 0.28, 0.26][lv]; });
                state = 'idle';
                if (ok) { rounds++; api.add(60); api.sfx('good'); api.burst(360, 220); api.say('똑같아요! 👏', true); if (rounds >= 3) api.win('리듬 3개를 따라 했어요!'); else makePattern(); }
                else api.hurt('박자가 달랐어요. 다시 듣고 따라 해 보세요.');
            }
            makePattern();
            return {
                step: function (dt) {
                    t += dt;
                    if (state === 'listen') { if (idx < pattern.length && t >= pattern[idx]) { ring(200, '#3b82f6'); idx++; clapAt = t; } if (idx >= pattern.length && t > pattern[idx - 1] + 0.6) { state = 'turn'; t = 0; taps = []; clapAt = -9; api.say('이제 내 차례! 같은 박자로 ' + pattern.length + '번', true); } }
                    if (state === 'turn' && taps.length && t - taps[taps.length - 1] > 2) { state = 'idle'; api.hurt(pattern.length + '번 쳐야 해요. ' + taps.length + '번만 쳤어요.'); }
                    rings = rings.filter(function (r) { r.r += 260 * dt; return r.r < 300; });
                },
                draw: function () {
                    api.clear('#0c4a6e', '#0ea5e9'); api.rect(0, 340, api.W, 100, '#e0f2fe');
                    rings.forEach(function (r) { api.g.globalAlpha = Math.max(0, 1 - r.r / 300); api.circle(r.x, 240, r.r, null, r.c === '#3b82f6' ? '#fde68a' : '#fff', 6); api.g.globalAlpha = 1; });
                    var hop = state === 'listen' && t - clapAt < 0.15 ? -16 : 0; api.emoji('🦭', 200, 260 + hop, 110); api.emoji(state === 'turn' && t - clapAt < 0.15 ? '👏' : '🧒', 520, 260, 90);
                    api.text('물개', 200, 366, 18); api.text('나', 520, 366, 18);
                    var scale = 560 / (pattern[pattern.length - 1] + 0.8);
                    if (lv === 0 || state !== 'turn') { api.text('물개 리듬', 70, 396, 14, '#1e3a8a'); if (state === 'listen') for (var i = 0; i < idx; i++) api.circle(130 + pattern[i] * scale, 396, 9, '#2563eb'); }
                    api.text('내 리듬', 70, 420, 14, '#92400e'); taps.forEach(function (v) { api.circle(130 + (v - taps[0]) * scale, 420, 9, '#f59e0b'); });
                    api.text(state === 'listen' ? '👂 듣는 시간' : state === 'turn' ? '👏 따라 치는 시간' : '[물개 박수 듣기]를 눌러요', 360, 80, 24, '#fff');
                    api.hud('성공 ' + rounds + ' / 3');
                }
            };
        }
    });

    // ④ 조종기: 보석 탐험 원격 조종
    RG('remote', {
        stages: ['조종기처럼! U 앞으로, D 뒤로, L·R 회전. 보석을 모두 모으세요. (키보드 화살표도 돼요)', '가시를 조심해요! 보석을 모두 모으세요.', '좁은 길과 가시! 시간 안에 모두 모으세요.'],
        tips: ['L·R은 로봇의 방향을 돌리고, U·D는 로봇이 보는 방향의 앞뒤로 움직여요.', '로봇의 입장에서 왼쪽과 오른쪽을 생각해야 해요. 마주 보면 반대로 보여요.', '조종기는 버튼마다 다른 신호를 무선으로 보내고, 로봇은 그 신호대로 움직여요.'],
        make: function (api, lv) {
            var walls = [[[250, 150, 30, 180]], [[200, 44, 26, 220], [460, 200, 26, 240]], [[160, 130, 26, 310], [330, 44, 26, 280], [500, 160, 26, 280]]][lv];
            var spikes = [[], [[330, 120], [340, 360], [600, 150]], [[250, 90], [430, 390], [560, 120], [250, 300]]][lv];
            var gems = [[[120, 100], [400, 100], [620, 330], [400, 380]], [[110, 120], [330, 250], [600, 90], [600, 380], [330, 400]], [[90, 90], [250, 400], [430, 90], [430, 300], [640, 380], [640, 80]]][lv].map(function (p) { return { x: p[0], y: p[1] }; });
            var r = { x: 70, y: 390, a: -Math.PI / 2 }, time = [45, 50, 55][lv], t = 0, total = gems.length, safe = 0;
            api.button({ t: 'L ↺', key: 'ArrowLeft' }); api.button({ t: 'U ▲', key: 'ArrowUp', cls: 'go' }); api.button({ t: 'D ▼', key: 'ArrowDown' }); api.button({ t: 'R ↻', key: 'ArrowRight' });
            function blocked(x, y) { if (x < 22 || x > 698 || y < 62 || y > 418) return true; return walls.some(function (w) { return x > w[0] - 20 && x < w[0] + w[2] + 20 && y > w[1] - 20 && y < w[1] + w[3] + 20; }); }
            return {
                step: function (dt) {
                    t += dt; safe -= dt;
                    r.a += ((api.held('ArrowRight') ? 1 : 0) - (api.held('ArrowLeft') ? 1 : 0)) * 3.1 * dt;
                    var s = ((api.held('ArrowUp') ? 1 : 0) - (api.held('ArrowDown') ? 0.7 : 0)) * 170 * dt, nx = r.x + Math.cos(r.a) * s, ny = r.y + Math.sin(r.a) * s;
                    if (!blocked(nx, r.y)) r.x = nx; if (!blocked(r.x, ny)) r.y = ny;
                    gems = gems.filter(function (m) { if (Math.hypot(m.x - r.x, m.y - r.y) < 32) { api.add(40); api.sfx('good'); api.burst(m.x, m.y, '#22d3ee'); return false; } return true; });
                    if (safe <= 0 && spikes.some(function (p) { return Math.hypot(p[0] - r.x, p[1] - r.y) < 32; })) { safe = 1.5; api.hurt('앗, 가시! 조심해요.'); if (api.playing()) { r.x = 70; r.y = 390; r.a = -Math.PI / 2; } }
                    if (!gems.length) { api.add(Math.round((time - t) * 6)); api.win('보석 ' + total + '개를 모두 모았어요!'); } else if (t >= time) api.fail('시간이 다 됐어요.');
                },
                draw: function () {
                    var g = api.g; api.clear('#1e293b', '#334155');
                    for (var i = 0; i < 18; i++) api.line([[i * 40, 44], [i * 40, 440]], 'rgba(255,255,255,.05)', 1);
                    walls.forEach(function (w) { api.rect(w[0], w[1], w[2], w[3], '#a16207', 8); });
                    spikes.forEach(function (p) { api.emoji('🌵', p[0], p[1], 36); }); gems.forEach(function (m) { api.emoji('💎', m.x, m.y + Math.sin(t * 4 + m.x) * 3, 32); });
                    g.save(); g.translate(r.x, r.y); g.rotate(r.a); if (safe > 0 && Math.floor(safe * 10) % 2) g.globalAlpha = 0.4;
                    api.rect(-20, -20, 38, 40, '#2563eb', 9); api.rect(-18, -26, 30, 8, '#0f172a', 3); api.rect(-18, 18, 30, 8, '#0f172a', 3); api.circle(10, -8, 5, '#fff'); api.circle(10, 8, 5, '#fff'); g.fillStyle = '#facc15'; g.beginPath(); g.moveTo(32, 0); g.lineTo(18, -9); g.lineTo(18, 9); g.fill(); g.restore();
                    api.hud('💎 ' + (total - gems.length) + ' / ' + total + ' · ⏱ ' + Math.max(0, Math.ceil(time - t)));
                }
            };
        }
    });

    // ⑤ 다이나믹셀 각도: 하키 슛
    RG('dxl', {
        stages: ['각도와 속도를 정하고 [슛!] 퍽을 골대에 넣으세요. 3골!', '골키퍼가 움직여요. 3골!', '가운데 벽이 있어요. 위아래 벽에 튕겨 넣어 보세요! 3골'],
        tips: ['0도는 정면, +는 아래쪽(오른쪽 돌기), −는 위쪽이에요. 모터는 정한 각도까지 정확히 움직여요.', '속도가 클수록 퍽이 빠르고 멀리 가요. 골키퍼가 비키는 순간을 노려요.', '벽에 부딪히면 들어온 각도와 같은 각도로 튕겨 나가요.'],
        make: function (api, lv) {
            var angle = api.slider('📐 각도', -60, 60, 0), power = api.slider('💨 속도', 1, 10, 7), puck = null, swing = 0, goals = 0, goalY, t = 0, shown = true, keeper = 240;
            function place() { goalY = api.rnd(110, 370); if (lv === 2) goalY = api.pick([api.rnd(100, 150), api.rnd(330, 380), 240]); }
            api.button({ t: '🏑 슛!', key: 'Space', cls: 'go', down: function () { if (puck) return; var a = angle.get() * Math.PI / 180, s = power.get() * 90; puck = { x: 150, y: 240, vx: Math.cos(a) * s, vy: Math.sin(a) * s }; swing = 0.35; api.sfx('shoot'); } });
            place();
            function miss(why) { puck = null; api.hurt(why); }
            return {
                step: function (dt) {
                    t += dt; swing -= dt; keeper = goalY + Math.sin(t * (lv === 2 ? 0 : 2.4)) * 52;
                    if (!puck) return;
                    var k = Math.pow(0.62, dt); puck.vx *= k; puck.vy *= k; puck.x += puck.vx * dt; puck.y += puck.vy * dt;
