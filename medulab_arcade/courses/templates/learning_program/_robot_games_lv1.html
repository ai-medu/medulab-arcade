<script>

    // ① 탄성력: 당긴 만큼 세게 날아가는 활

        tips: ['고무줄을 많이 당길수록 원래 모양으로 돌아가려는 힘(탄성력)이 커져서 화살이 빠르게 날아가요.', '비스듬히 위로 쏘면 멀리 날아가요. 날아가는 화살은 지구가 당겨서 점점 아래로 휘어요.', '바람은 날아가는 화살을 밀어요. 힘이 여러 개면 움직임이 함께 바뀌어요.'],
        make: function (api, lv) {
            var bx = 110, by = 300, start = null, cur = null, arrow = null, hits = 0, target, wind = 0, balloon = null, t = 0;

            place();

            return {
                down: function (x, y) { if (!arrow) { start = [x, y]; cur = [x, y]; } },

                up: function () {

                step: function (dt) {

                    var d = Math.hypot(tipX - target.x, tipY - target.y);

    // ② 팔 길이와 힘
    RG('arm', {

        make: function (api, lv) {

                else if (lv === 1) { dist = api.pick([2, 3, 4]); weight = 5 - dist + api.pick([0, 0, -1]); weight = Math.max(2, weight); }
                else { dist = api.pick([1, 2, 3, 4, 5]); weight = 6 - dist; }
                task = { dist: dist, weight: weight, icon: api.pick(things) }; ext = 0; acting = false; result = null;
            }
            len = api.slider('🦾 팔 길이', 1, 5, 3, function () { if (!acting) ext = 0; });
            api.button({ t: '⚙️ 작동!', key: 'Space', cls: 'go', down: function () { if (acting) return; acting = true; len.lock(true); api.sfx('pop'); } });
            next();
            return {
                step: function (dt) {

                        }
                    } else {
                        wait -= dt;

                    }
                },
                draw: function () {

                    for (var i = 1; i <= 5; i++) { api.line([[bx + i * 100, 340], [bx + i * 100, 360]], '#44403c', 3); api.text(i + '칸', bx + i * 100, 374, 15, '#1c1917'); }
                    var ox = bx + task.dist * 100, oy = result === 'ok' ? y - 60 * Math.min(1, (1.6 - wait) * 2) : y;
                    var wob = result === 'weak' ? Math.sin(wait * 40) * 4 : 0;
                    api.emoji(task.icon, ox + wob, oy + 12, 38 + task.weight * 7); api.rect(ox - 38, oy - 62, 76, 24, '#1e293b', 12); api.text('무게 ' + task.weight, ox, oy - 50, 15, '#fff');
                    var tip = bx + L * 100 * (acting ? ext : 0.18), sag = result === 'weak' ? 34 : 0;
                    api.rect(bx - 64, y - 10, 74, 62, '#475569', 12); api.emoji('🤖', bx - 28, y - 34, 50);
                    api.line([[bx, y + 6], [(bx + tip) / 2, y + 6 + sag * 0.6], [tip, y + 6 + sag - (result === 'ok' ? 60 * Math.min(1, (1.6 - wait) * 2) : 0)]], '#22c55e', 18);
                    api.circle(bx, y + 6, 13, '#fde047', '#a16207'); api.emoji('🤏', tip + 14, y + sag + 6 - (result === 'ok' ? 60 * Math.min(1, (1.6 - wait) * 2) : 0), 34);
                    api.text('닿는 거리', 80, 70, 17); api.bar(150, 58, 220, 24, L / 5, '#3b82f6', L + '칸');
                    api.text('돌리는 힘', 80, 104, 17); api.bar(150, 92, 220, 24, (6 - L) / 5, '#ef4444', '힘 ' + (6 - L));
                    api.rect(430, 52, 260, 72, 'rgba(255,255,255,.9)', 14); api.text('임무: ' + task.dist + '칸 떨어진', 560, 74, 18); api.text('무게 ' + task.weight + ' 짜리를 옮겨라!', 560, 102, 18, '#b91c1c');
                    api.hud('임무 ' + done + ' / 3');
                }
            };
        }
    });

    // ③ 원과 바퀴: 달걀 배달
    RG('wheel', {
        stages: ['바퀴 모양을 고르고 [달리기]를 누른 채 달걀을 깨뜨리지 말고 시간 안에 배달해요!', '길에 돌멩이가 있어요. 돌 앞에서는 속도를 줄여요.', '돌이 많고 시간이 빠듯해요. 가장 좋은 바퀴로 조심조심!'],
        tips: ['동그란 바퀴는 가운데에서 땅까지 거리가 늘 같아 흔들리지 않아요.', '빠를수록 돌에 부딪힐 때 충격이 커요. 속도를 줄이면 충격도 작아져요.', '모서리가 많아질수록 원에 가까워지고 덜 덜컹거려요. 원은 모서리가 없어요.'],
        make: function (api, lv) {

            var wheel = shapes[1], x = 0, v = 0, turn = 0, stress = 0, goal = [1700, 2000, 2300][lv], time = [20, 22, 24][lv], t = 0;
            var rocks = [[], [600, 1150, 1600], [450, 800, 1150, 1450, 1800, 2080]][lv].map(function (p) { return { x: p, hit: false }; });
            var btns = shapes.map(function (s) { return api.button({ t: s.name, down: function (b) { if (v > 25) { api.say('멈춘 다음에 바퀴를 바꿔요!'); return; } wheel = s; mark(b); api.sfx('pop'); } }); });
            function mark(b) { btns.forEach(function (q) { q.classList.toggle('on', q === b); }); }
            mark(btns[1]);
            api.button({ t: '⏩ 달리기 (누르고 있기)', key: 'ArrowRight', cls: 'go' });
            return {
                step: function (dt) {
                    t += dt; var go = api.held('ArrowRight');
                    v = api.clamp(v + (go ? 130 : -190) * dt, 0, 200); x += v * dt; turn += v * dt / 34;
                    stress = Math.max(0, stress + (wheel.k * v * 0.0052 - 0.34) * dt);
                    rocks.forEach(function (r) { if (!r.hit && x >= r.x) { r.hit = true; var j = v / 270 * (wheel.n ? 1.35 : 1); stress += j; if (j > 0.25) { api.sfx('pop'); api.float(200, 250, '덜컹!', '#b45309'); } } });
                    if (stress >= 1) { stress = 0; v = 0; api.burst(190, 240, '#facc15', 26); api.hurt('와장창! 달걀이 깨졌어요. 바퀴 모양이나 속도를 바꿔요.'); }
                    if (x >= goal) { api.add(Math.round((time - t) * 10)); api.win(Math.round(t) + '초 만에 배달 성공!'); }
                    else if (t >= time) api.fail('시간이 다 됐어요. 흔들림이 적은 바퀴면 빨리 달릴 수 있어요.');
                },
                draw: function () {
                    var g = api.g, R = 34, h = R; api.clear();
                    for (var i = 0; i < 6; i++) api.emoji(i % 2 ? '🌳' : '🌲', ((i * 160 - x * 0.35) % 960 + 960) % 960 - 80, 300, 54);
                    api.rect(0, 350, api.W, 90, '#a8a29e');
                    for (i = 0; i < 14; i++) api.rect(((i * 70 - x) % 980 + 980) % 980 - 60, 392, 34, 7, '#f5f5f4', 3);
                    rocks.forEach(function (r) { var sx = 215 + r.x - x; if (sx > -40 && sx < 760) api.emoji('🪨', sx, 342, 28); });
                    api.emoji('🏠', 260 + goal - x, 312, 80);
                    if (wheel.n) { var seg = 6.2832 / wheel.n; h = R * Math.cos((turn % seg) - Math.PI / wheel.n); }
                    var cy = 350 - h;
                    api.rect(105, cy - 52, 180, 34, '#2563eb', 10); api.emoji('🧑‍✈️', 128, cy - 70, 34);
                    var jig = Math.sin(t * 38) * stress * 8; api.emoji('🥚', 215 + jig, cy - 76 - Math.abs(jig), 44, jig * 0.03);
                    [140, 250].forEach(function (wx) {
                        g.save(); g.translate(wx, cy); g.rotate(turn + (wheel.n ? Math.PI / 2 - Math.PI / wheel.n : 0)); g.beginPath();
                        if (wheel.n) { for (var k = 0; k < wheel.n; k++) { var a = k * 6.2832 / wheel.n; g[k ? 'lineTo' : 'moveTo'](R * Math.cos(a), R * Math.sin(a)); } g.closePath(); } else g.arc(0, 0, R, 0, 7);
                        g.fillStyle = '#1f2937'; g.fill(); api.line([[0, 0], [R * 0.7, 0]], '#facc15', 5); api.circle(0, 0, 7, '#e5e7eb'); g.restore();
                    });
                    api.text('달걀 충격', 70, 62, 16); api.bar(125, 52, 180, 20, stress, stress > 0.65 ? '#dc2626' : '#22c55e');
                    api.text('🏁 배달', 400, 62, 16); api.bar(450, 52, 240, 20, x / goal, '#3b82f6');
                    api.hud('⏱ ' + Math.max(0, Math.ceil(time - t)) + '초 · 속도 ' + Math.round(v));
                }

    // ④ 도구: 눈 치우기 불도저
    RG('snow', {
        stages: ['화살표(또는 화면 끌기)로 불도저를 움직여 눈덩이를 오른쪽 파란 구역으로 밀어요. 판 넓이를 골라 보세요!', '눈이 더 많아졌어요. 넓은 판은 한 번에 많이 밀지만 느려요.', '바위가 있어요. 상황에 맞게 판을 바꿔 가며 치우세요.'],
        tips: ['앞판이 넓으면 한 번에 더 많은 눈을 옮길 수 있어요. 그래서 제설차의 판은 넓어요.', '도구가 커지면 일은 한 번에 많이 하지만 움직이기 둔해질 수 있어요.', '일에 알맞은 도구를 고르면 시간과 힘을 아낄 수 있어요.'],
        make: function (api, lv) {
            var d = { x: 60, y: 240, dx: 1, dy: 0 }, wide = false, time = [40, 45, 50][lv], t = 0, aim = null, balls = [], total = [8, 12, 16][lv], cleared = 0;
            var rocks = lv === 2 ? [{ x: 330, y: 160 }, { x: 420, y: 330 }] : [];
            while (balls.length < total) { var b = { x: api.rnd(150, 540), y: api.rnd(100, 380), r: 15 }; if (!rocks.some(function (r) { return Math.hypot(r.x - b.x, r.y - b.y) < 60; })) balls.push(b); }
            var narrow = api.button({ t: '🥄 좁은 판 (빠름)', down: function () { set(false); } }), broad = api.button({ t: '🚜 넓은 판 (많이)', down: function () { set(true); } });
            function set(w) { wide = w; narrow.classList.toggle('on', !w); broad.classList.toggle('on', w); }
            set(false);

                    if (mx && my) my = 0;
                    if (mx || my) {
                        d.dx = mx; d.dy = my; var sp = wide ? 135 : 215, nx = api.clamp(d.x + mx * sp * dt, 28, 640), ny = api.clamp(d.y + my * sp * dt, 66, 414);
                        if (!rocks.some(function (r) { return Math.hypot(r.x - nx, r.y - ny) < 52; })) { d.x = nx; d.y = ny; }
                    }
                    var half = wide ? 62 : 24, px = -d.dy, py = d.dx;
                    balls.forEach(function (b) {
                        var rx = b.x - d.x, ry = b.y - d.y, u = rx * d.dx + ry * d.dy, w = rx * px + ry * py;
                        if (Math.abs(w) < half + b.r * 0.5 && u > 4 && u < 34 + b.r + 6) { u = 34 + b.r + 6; b.x = api.clamp(d.x + d.dx * u + px * w, 84, 700); b.y = api.clamp(d.y + d.dy * u + py * w, 92, 390); }
                    });
                    balls = balls.filter(function (b) { if (b.x > 612) { cleared++; api.add(10); api.sfx('pop'); api.burst(b.x, b.y, '#fff', 10); return false; } return true; });
                    if (!balls.length) { api.add(Math.round((time - t) * 8)); api.win(Math.round(t) + '초 만에 모두 치웠어요!'); }
                    else if (t >= time) api.fail('시간 끝! 넓은 판으로 한 줄씩 모아 밀어 보세요.');
                },
                draw: function () {

                    balls.forEach(function (b) { api.circle(b.x, b.y, b.r, '#fff', '#60a5fa', 3); api.emoji('❄️', b.x, b.y, 15); });
                    g.save(); g.translate(d.x, d.y); g.rotate(Math.atan2(d.dy, d.dx));
