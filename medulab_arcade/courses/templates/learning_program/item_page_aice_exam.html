{% extends "learning_program/item_page_aice.html" %}

{% block extra_css %}
{{ block.super }}
<style>
    .aice-wrap.exam .aice-panel { width: 460px; background: #fff; color: #1e293b; border-left: 1px solid #e2e8f0; }
    .ex-head { background: #3b6df0; color: #fff; padding: 14px 18px 16px; flex-shrink: 0; }
    .ex-head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .ex-logo { font-weight: 900; font-size: 17px; letter-spacing: .5px; }
    .ex-timer { background: rgba(255,255,255,.18); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .ex-timer.warn { background: #ef4444; }
    .ex-name { font-size: 20px; font-weight: 900; margin-top: 8px; }
    .ex-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .ex-qhead { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #3b6df0; padding-bottom: 8px; margin-bottom: 14px; font-weight: 800; }
    .ex-qhead .cnt { color: #64748b; font-size: 12px; font-weight: 700; }
    .ex-qtype { display: inline-block; font-size: 11px; font-weight: 800; color: #3b6df0; background: #e8eefe; border-radius: 6px; padding: 2px 8px; margin-left: 8px; }
    .ex-text { font-size: 14.5px; line-height: 1.7; font-weight: 600; margin-bottom: 12px; }
    .ex-text b { color: #3b6df0; }
    .ex-img { width: 100%; border-radius: 10px; border: 1px solid #e2e8f0; display: block; margin-bottom: 12px; background: #fff; }
    .ex-choices { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .ex-choice { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; cursor: pointer; font-size: 14px; background: #fff; }
    .ex-choice:hover { border-color: #3b6df0; }
    .ex-choice.sel { border-color: #3b6df0; background: #eef3ff; font-weight: 800; }
    .ex-circle-row { display: flex; gap: 10px; margin: 10px 0 4px; }
    .ex-circle { flex: 1; text-align: center; padding: 12px 0; border: 1.5px solid #e2e8f0; border-radius: 12px; cursor: pointer; font-size: 20px; font-weight: 800; background: #fff; color: #475569; }
    .ex-circle.sel { border-color: #3b6df0; background: #3b6df0; color: #fff; }
    .ex-hint { font-size: 12.5px; color: #64748b; background: #f8fafc; border-radius: 10px; padding: 10px 12px; margin-top: 10px; line-height: 1.6; }
    .ex-gen { margin-top: 12px; padding: 12px; border: 1px dashed #3b6df0; border-radius: 12px; background: #f5f8ff; font-size: 13px; line-height: 1.6; }
    .ex-gen a.dl { display: inline-block; margin-top: 6px; padding: 8px 14px; border-radius: 9px; background: #3b6df0; color: #fff; font-weight: 800; text-decoration: none; }
    .ex-gen .none { color: #94a3b8; }
    .ex-gen label.up { display: inline-block; margin-top: 6px; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; cursor: pointer; background: #fff; color: #334155; }
    .ex-foot { flex-shrink: 0; padding: 12px 20px 14px; border-top: 1px solid #e2e8f0; background: #fff; }
    .ex-nav { display: flex; gap: 10px; }
    .ex-nav button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; background: #3b6df0; color: #fff; }
    .ex-nav button:disabled { background: #e2e8f0; color: #94a3b8; cursor: default; }
    .ex-foot-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #64748b; gap: 8px; }
    .ex-end { padding: 10px 16px; border: none; border-radius: 10px; background: #2563eb; color: #fff; font-weight: 800; cursor: pointer; font-size: 13px; }
    .ex-dots { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .ex-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #cbd5e1; background: #fff; font-size: 12px; font-weight: 800; color: #64748b; cursor: pointer; }
    .ex-dot.done { background: #dbe6ff; border-color: #3b6df0; color: #3b6df0; }
    .ex-dot.cur { background: #3b6df0; border-color: #3b6df0; color: #fff; }
    .ex-modal { position: absolute; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
    .ex-modal.show { display: flex; }
    .ex-modal-box { background: #fff; border-radius: 14px; padding: 24px 22px; text-align: center; max-width: 340px; width: 100%; color: #1e293b; }
    .ex-modal-box h3 { margin: 0 0 8px; font-size: 17px; }
    .ex-modal-box p { margin: 0 0 16px; font-size: 13px; color: #64748b; line-height: 1.6; }
    .ex-modal-box .btns { display: flex; gap: 8px; }
    .ex-modal-box button { flex: 1; padding: 11px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; background: #e2e8f0; color: #334155; }
    .ex-modal-box button.pri { background: #2563eb; color: #fff; }
    .ex-spin { width: 34px; height: 34px; border: 4px solid #dbe6ff; border-top-color: #2563eb; border-radius: 50%; margin: 14px auto 0; animation: exspin .8s linear infinite; }
    @keyframes exspin { to { transform: rotate(360deg); } }
    .ex-score { text-align: center; padding: 8px 0 14px; }
    .ex-score .big { font-size: 40px; font-weight: 900; color: #2563eb; }
    .ex-score .sub { color: #64748b; font-size: 13px; }
    .ex-res { border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
    .ex-res .rh { display: flex; justify-content: space-between; font-weight: 800; font-size: 14px; }
    .ex-res .ok { color: #16a34a; } .ex-res .no { color: #dc2626; } .ex-res .self { color: #d97706; }
    .ex-res .ex { font-size: 13px; line-height: 1.65; color: #475569; margin-top: 6px; }
    .ex-res img { width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 8px; }
    .ex-res label.chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .ex-retry { width: 100%; margin-top: 6px; padding: 12px; border: 1.5px solid #3b6df0; border-radius: 10px; background: #fff; color: #3b6df0; font-weight: 800; cursor: pointer; }
</style>
{% endblock %}

{% block content %}
<div class="aice-wrap exam">
    <div class="aice-ide">
        <iframe id="codinyFrame" src="https://aicodiny.com/aice/codex-iframe" title="AI Codiny" allow="microphone; camera"></iframe>
    </div>

    <form id="aiceCsrfForm" style="display:none;">{% csrf_token %}</form>
    <div class="aice-panel" id="aicePanel" data-item-id="{{ item.id }}">
        <button type="button" class="aice-toggle" id="aiceToggle">›</button>
        <div class="ex-head">
            <div class="ex-head-top">
                <span class="ex-logo">🎓 AICE</span>
                <span class="ex-timer" id="exTimer">종료 시각 --:-- | 남은 시간 --:--</span>
            </div>
            <div class="ex-name">{{ exam.title }}</div>
        </div>
        <div class="ex-body" id="exBody"></div>
        <div class="ex-foot" id="exFoot">
            <div class="ex-nav">
                <button type="button" id="exPrev">이전 문항</button>
                <button type="button" id="exNext">다음 문항</button>
            </div>
            <div class="ex-foot-row">
                <span id="exSaveMsg">✔ 답안은 자동으로 임시 저장돼요.</span>
                <button type="button" class="ex-end" id="exEnd">시험종료하기</button>
            </div>
        </div>

        <div class="ex-modal" id="exConfirm">
            <div class="ex-modal-box">
                <h3>시험을 종료할까요?</h3>
                <p id="exConfirmMsg"></p>
                <div class="btns"><button type="button" id="exConfirmNo">계속 풀기</button><button type="button" class="pri" id="exConfirmYes">제출하기</button></div>
            </div>
        </div>
        <div class="ex-modal" id="exSubmitting">
            <div class="ex-modal-box">
                <h3>답안을 제출 중입니다.</h3>
                <p>잠시만 기다려 주세요.</p>
                <div class="ex-spin"></div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    var EXAM = {{ exam.json|safe }};
    var SAVED = {{ exam.saved_json|safe }};
    var ITEM_ID = {{ item.id }};
    var CSRF = document.querySelector('#aiceCsrfForm input[name=csrfmiddlewaretoken]').value;
    var KEY = 'aiceExam_' + ITEM_ID;
    var qs = EXAM.questions, cur = 0, answers = {}, selfOk = {}, finished = false, timerId = null, endAt = 0;
    var body = document.getElementById('exBody'), foot = document.getElementById('exFoot');
    var $ = function (id) { return document.getElementById(id); };
    var CIRC = ['①', '②', '③', '④', '⑤'];

    // ── AI Codiny 연동 (aicodiny.com/aice/codex-iframe 의 postMessage API: postGEN / getGEN) ──
    var frame = document.getElementById('codinyFrame');
    var CODINY_ORIGIN = 'https://aicodiny.com';
    var codinyReady = false, openedNo = null, openSeq = 0, pendingSave = null;
    function codinyPost(msg) { try { frame.contentWindow.postMessage(msg, '*'); } catch (e) {} }
    function setCodinyStatus(t, ok) {
        var el = document.getElementById('exCodinyMsg');
        if (el) { el.textContent = t; el.style.color = ok === false ? '#dc2626' : ok ? '#16a34a' : '#64748b'; }
    }
    function workKey(no) { return '_work' + no; }
    function stripGen(g) { try { g.thumbnailUrl = ''; } catch (e) {} return g; }
    // 현재 코디니 작업을 가져와 저장(풀던 코딩 보존). 실행 중이면 건너뛴다.
    function saveWork(no, done) {
        if (!codinyReady || !no || openedNo !== no) { done(); return; }
        var finishedSave = false;
        function end() { if (finishedSave) return; finishedSave = true; pendingSave = null; done(); }
        pendingSave = { cb: function (gen) { if (gen && typeof gen === 'object') store(workKey(no), stripGen(gen)); end(); } };
        codinyPost({ type: 'getGEN', question_id: String(no) });
        setTimeout(end, 2500);
    }
    function loadGenInto(url, qno, okText) {
        var seq = ++openSeq;
        setCodinyStatus('문제 파일을 코디니에 여는 중…');
        fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
            .then(function (gen) {
                if (seq !== openSeq) return;
                codinyPost({ type: 'postGEN', gen: gen, question_id: String(qno) });
                openedNo = qno;
                setCodinyStatus('✅ ' + okText, true);
            }).catch(function () { setCodinyStatus('문제 파일을 자동으로 열지 못했어요. 아래 "파일 받기"로 받아서 코디니에서 열어 주세요.', false); });
    }
    function openQuestion(q) {
        if (!q.gen_url) { openedNo = null; return; }
        if (!codinyReady) { setCodinyStatus('코디니를 불러오는 중이에요. 잠시만 기다려 주세요…'); return; }
        var mine = load(workKey(q.no));
        if (mine) {
            ++openSeq;
            codinyPost({ type: 'postGEN', gen: mine, question_id: String(q.no) });
            openedNo = q.no; setCodinyStatus('✅ 이전에 풀던 코딩을 이어서 열었어요.', true);
        } else {
            loadGenInto(q.gen_url, q.no, '문제 파일을 코디니에 열었어요. 바로 풀어 보세요!');
        }
    }
    window.addEventListener('message', function (e) {
        if (e.origin !== CODINY_ORIGIN || !e.data || typeof e.data !== 'object') return;
        var d = e.data;
        if (d.type === 'notify_loadingState' && d.message === 'loaded') {
            if (!codinyReady) { codinyReady = true; setTimeout(function () { if (!finished) openQuestion(qs[cur]); }, 400); }
        } else if (d.type === 'response_getGEN' && pendingSave) {
            pendingSave.cb(d.gen === 'ignore' ? null : d.gen);
        } else if (d.type === 'response_postGEN' && d.message === 'fail') {
            setCodinyStatus('코디니에서 파일을 여는 데 실패했어요. 아래 "파일 받기"로 받아서 직접 열어 주세요.', false);
        }
    });

    function store(k, v) { try { if (v === null) localStorage.removeItem(KEY + k); else localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
    function load(k) { try { var v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function two(n) { return n < 10 ? '0' + n : '' + n; }

    function startTimer() {
        var saved = load('_end');
        endAt = saved && saved > Date.now() ? saved : Date.now() + EXAM.minutes * 60000;
        store('_end', endAt);
        var d = new Date(endAt);
        var endLabel = two(d.getHours()) + ':' + two(d.getMinutes());
        clearInterval(timerId);
        timerId = setInterval(function () {
            var left = Math.max(0, Math.floor((endAt - Date.now()) / 1000));
            var t = $('exTimer');
            t.textContent = '종료 시각 ' + endLabel + ' | 남은 시간 ' + two(Math.floor(left / 60)) + ':' + two(left % 60);
            t.classList.toggle('warn', left <= 300);
            if (left <= 0) { clearInterval(timerId); submit(true); }
        }, 1000);
    }

    function render() {
        var q = qs[cur], n = qs.length;
        var dots = '<div class="ex-dots">' + qs.map(function (x, i) {
            var done = x.kind === 'mcq' ? answers[x.no] !== undefined : !!load(workKey(x.no)) || (x.no === qs[cur].no && openedNo === x.no);
            return '<button type="button" class="ex-dot' + (i === cur ? ' cur' : done ? ' done' : '') + '" data-i="' + i + '">' + x.no + '</button>';
        }).join('') + '</div>';
        var h = dots + '<div class="ex-qhead"><span>문항 ' + q.no + '<span class="ex-qtype">' + esc(q.label) + ' · ' + q.points + '점</span></span><span class="cnt">' + (cur + 1) + '/' + n + '</span></div>';
        h += '<div class="ex-text">' + esc(q.text) + '</div>';
        if (q.image) h += '<img class="ex-img" src="' + q.image + '" alt="문항 ' + q.no + ' 그림">';
        if (q.kind === 'mcq') {
            h += '<div class="ex-choices">' + q.choices.map(function (c, i) {
                return '<div class="ex-choice' + (answers[q.no] === i + 1 ? ' sel' : '') + '" data-c="' + (i + 1) + '">' + CIRC[i] + ' ' + esc(c) + '</div>';
            }).join('') + '</div>';
        } else if (q.kind === 'fill') {
            h += '<div class="ex-hint">왼쪽 AI Codiny에서 빨간 네모 부분의 블록을 직접 고치거나 채워 완성하세요. 보기 블록은 그림과 코디니 화면에 있어요. 코딩한 블록이 정답과 같으면 정답으로 채점돼요.</div>';
        } else {
            h += '<div class="ex-hint">왼쪽 AI Codiny에서 직접 코딩해 보세요. 다 끝나면 오른쪽 아래 <b>시험종료하기</b>를 눌러 제출하면 코딩한 블록이 정답과 비교돼요.</div>';
        }
        h += '<div class="ex-gen">';
        if (q.gen_url) {
            h += '📂 <b>문제 파일이 왼쪽 코디니에 자동으로 열려요.</b><div id="exCodinyMsg" style="margin-top:4px;font-size:12.5px;"></div>';
            h += '<div style="margin-top:8px;font-size:12px;color:#64748b;"><a href="#" id="exReset" style="color:#3b6df0;font-weight:700;">처음 문제 파일로 다시 열기</a> · <a href="' + q.gen_url + '" download style="color:#64748b;">파일 받기</a></div>';
        } else {
            h += '<span class="none">📂 이 문항은 코디니 파일이 필요 없어요.</span>';
        }
        h += '</div>';
        body.innerHTML = h;
        body.scrollTop = 0;
        var rs = document.getElementById('exReset');
        if (rs) rs.onclick = function (ev) {
            ev.preventDefault();
            if (!confirm('지금 코딩한 내용이 지워지고 처음 문제 파일로 돌아가요. 계속할까요?')) return;
            store(workKey(q.no), null);
            if (codinyReady) loadGenInto(q.gen_url, q.no, '문제 파일을 처음 상태로 다시 열었어요.');
        };
        $('exPrev').disabled = cur === 0;
        $('exNext').disabled = cur === n - 1;
    }

    function persist() { store('_ans', answers); store('_self', selfOk); }

    body.addEventListener('click', function (e) {
        var c = e.target.closest('[data-c]');
        if (c && !finished) { answers[qs[cur].no] = parseInt(c.dataset.c, 10); persist(); render(); return; }
        var d = e.target.closest('.ex-dot');
        if (d) { goto(parseInt(d.dataset.i, 10)); }
    });
    function goto(i) {
        if (i === cur || i < 0 || i >= qs.length) return;
        var prev = qs[cur];
        saveWork(prev.no, function () { cur = i; render(); openQuestion(qs[cur]); });
    }
    $('exPrev').onclick = function () { goto(cur - 1); };
    $('exNext').onclick = function () { goto(cur + 1); };
    $('aiceToggle').onclick = function () {
        var p = $('aicePanel'), c = p.classList.toggle('collapsed'); this.textContent = c ? '‹' : '›';
    };

    $('exEnd').onclick = function () {
        var un = qs.filter(function (q) { return q.kind === 'mcq' && answers[q.no] === undefined; }).length;
        $('exConfirmMsg').textContent = un ? '아직 답하지 않은 객관식 문항이 ' + un + '개 있어요. 그래도 제출할까요?' : '제출하면 코딩한 블록과 선택한 답이 바로 채점돼요. 제출할까요?';
        $('exConfirm').classList.add('show');
    };
    $('exConfirmNo').onclick = function () { $('exConfirm').classList.remove('show'); };
    $('exConfirmYes').onclick = function () { $('exConfirm').classList.remove('show'); submit(false); };

    // 채점에 필요한 최소 정보만 보낸다 (블록 XML + 오브젝트 id/이름)
    function collectWorks() {
        var out = {};
        qs.forEach(function (q) {
            var g = load(workKey(q.no));
            if (g && g.scenes && g.scenes[0]) {
                out[q.no] = { scenes: [{ blockXml: g.scenes[0].blockXml, objects: (g.scenes[0].objects || []).map(function (o) { return { objectId: o.objectId, objectName: o.objectName }; }) }] };
            }
        });
        return out;
    }
    function post(cb) {
        fetch('/courses/api/item/' + ITEM_ID + '/exam/submit/', {
            method: 'POST', headers: { 'X-CSRFToken': CSRF, 'Content-Type': 'application/json' },
            body: JSON.stringify({ answers: answers, self: selfOk, works: collectWorks() })
        }).then(function (r) { return r.json(); }).then(cb).catch(function () { alert('제출에 실패했어요. 잠시 후 다시 시도해 주세요.'); $('exSubmitting').classList.remove('show'); });
    }
    function submit(auto) {
        $('exSubmitting').classList.add('show');
        var t0 = Date.now();
        saveWork(qs[cur].no, function () { post(handleSubmitted); });
        function handleSubmitted(res) {
            var wait = Math.max(0, 1200 - (Date.now() - t0));
            setTimeout(function () {
                $('exSubmitting').classList.remove('show');
                if (!res.ok) { alert(res.message || '제출 실패'); return; }
                finished = true; clearInterval(timerId); store('_end', null);
                showResult(res);
            }, wait);
        }
    }

    function showResult(res) {
        foot.style.display = 'none';
        $('exTimer').textContent = '시험 종료';
        $('exTimer').classList.remove('warn');
        selfOk = res.self || {}; answers = res.answers || {};
        var h = '<div class="ex-score"><div class="big">' + res.score + ' / ' + res.max + '점</div><div class="sub">이론 문항은 선택한 답으로, 실습 문항은 코디니에서 코딩한 블록을 정답과 비교해 채점했어요.</div></div>';
        res.details.forEach(function (d) {
            var q = qs[d.no - 1], status, cls;
            if (d.kind === 'build') { status = d.ok ? '정답 (+' + d.points + ')' : '오답'; cls = d.ok ? 'ok' : 'no'; }
            else { status = d.ok ? '정답' : '오답'; cls = d.ok ? 'ok' : 'no'; }
            h += '<div class="ex-res"><div class="rh"><span>문항 ' + d.no + ' <span style="font-weight:600;color:#64748b;font-size:12px;">(' + d.points + '점)</span></span><span class="' + cls + '">' + status + '</span></div>';
            if (d.kind === 'mcq') h += '<div class="ex" style="margin-top:4px;">내 답: ' + (d.mine ? CIRC[d.mine - 1] : '미응답') + ' · 정답: ' + CIRC[d.answer - 1] + '</div>';
            if (d.auto === 'match') h += '<div class="ex" style="margin-top:4px;color:#16a34a;font-weight:700;">🤖 자동 채점: 코딩한 블록이 정답과 같아요</div>';
            else if (d.auto === 'mismatch') h += '<div class="ex" style="margin-top:4px;color:#dc2626;font-weight:700;">🤖 자동 채점: 코딩한 블록이 정답과 달라요</div>';
            else if (d.auto === 'none' && d.kind !== 'mcq') h += '<div class="ex" style="margin-top:4px;color:#94a3b8;">🤖 자동 채점: 코디니에서 코딩한 내용이 없어요</div>';
            h += '<div class="ex">💡 ' + esc(d.explain) + '</div>';
            if (d.answer_gen) h += '<button type="button" class="ex-retry" style="margin-top:8px;padding:8px;" data-agen="' + d.answer_gen + '" data-ano="' + d.no + '">🧩 정답 코드를 코디니에서 보기</button>';
            if (d.answer_image) {
                h += '<img src="' + d.answer_image + '" alt="정답 블록">';
            }
            h += '</div>';
        });
        h += '<button type="button" class="ex-retry" id="exRetry">🔁 다시 풀기</button>';
        body.innerHTML = h; body.scrollTop = 0;
        body.querySelectorAll('[data-agen]').forEach(function (b) {
            b.onclick = function () { loadGenInto(b.dataset.agen, parseInt(b.dataset.ano, 10), '정답 코드를 코디니에 열었어요. (내가 코딩한 내용은 저장돼 있어요)'); openedNo = null; };
        });
        $('exRetry').onclick = function () {
            finished = false; answers = {}; selfOk = {}; cur = 0; persist(); store('_end', null); qs.forEach(function (x) { store(workKey(x.no), null); }); openedNo = null;
            foot.style.display = ''; render(); startTimer(); openQuestion(qs[0]);
        };
    }

    if (SAVED && SAVED.exam) {
        finished = true;
        showResult(SAVED);
    } else {
        answers = load('_ans') || {}; selfOk = load('_self') || {};
        render(); startTimer();
    }
})();
</script>
{% endblock %}
